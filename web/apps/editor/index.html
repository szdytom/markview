<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markview · reading desk</title>
<style>
html,body{margin:0;height:100%;background:#d9e4ed;color:#273240;font-family:"Noto Sans","Segoe UI",sans-serif}body{display:flex;flex-direction:column}.masthead{display:flex;justify-content:space-between;align-items:center;padding:18px 26px;border-bottom:1px solid #bdcbd8;gap:20px}.brand{font-family:"Noto Serif",Georgia,serif;font-size:23px;letter-spacing:-.03em}.masthead small{color:#55687e}main{flex:1;min-height:0;padding:18px 24px 24px}#desk{height:100%;box-shadow:0 2px 12px #27324018}#error{color:#982a25;margin:0 24px}button{border:1px solid #a8bacb;background:transparent;padding:6px 12px;color:inherit;cursor:pointer}@media(max-width:600px){main{padding:0}.masthead{padding:10px 16px}.masthead small{display:none}}
