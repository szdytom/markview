				autocapitalize="off" autocomplete="off" wrap="soft"># MarkView as a Component

Markview lays out and paints Markdown **directly onto a canvas**. There is no
DOM tree, no HTML renderer and no KaTeX: *markview-core* parses the source,
*markview-render* rasterises glyphs through the GPU, and this page only wires
the two together.

> The engine does the rendering. JavaScript only runs the frame loop.

## What the reader gets

1. Continuous, incremental layout — a long document paints a prefix at once.
2. Real typography: justification, hyphenation and optical margins.
3. Selection and copy, driven straight from the pointer.

| Stage | Crate | Output |
| --- | --- | --- |
| Parse | markview-core | block tree |
| Layout | markview-core | line boxes |
| Raster | markview-render | glyph atlas |

Inline math is typeset by the engine: $e^{i\pi} + 1 = 0$.

```rust
pub fn layout(&mut self, doc: &Document) -> Snapshot {
  self.blocks.reuse(doc)
}
```

中文排版：标点、换行、字距与字体都由 Markview 处理。中英文混排同样可以排版。
