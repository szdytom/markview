# Configuration for `cargo about`, which generates the third-party notices
# shipped with release artifacts.
#
# The default list accepts permissive licenses; crate-specific exceptions live
# below it. Anything outside these lists fails the release build. Add a default
# identifier only after confirming it is permissive.
accepted = [
	"0BSD",
	"Apache-2.0",
	"BSD-2-Clause",
	"BSD-3-Clause",
	"BSL-1.0",
	"CC0-1.0",
	"CDLA-Permissive-2.0",
	"ISC",
	"MIT",
	"Unicode-3.0",
	"Unicode-DFS-2016",
	"Unlicense",
	"Zlib",
]

# Workspace members are not dependencies of the shipped binary.
private = { ignore = true }

# The web article parser uses these unmodified MPL-2.0 components. The notices
# include their license text and links to the exact published source packages.
[cssparser]
accepted = ["MPL-2.0"]

[cssparser-macros]
accepted = ["MPL-2.0"]

[dtoa-short]
accepted = ["MPL-2.0"]

[selectors]
accepted = ["MPL-2.0"]

# The quick-open palette uses this unmodified MPL-2.0 matcher. The notices
# include its license text and a link to the exact published source package.
[nucleo-matcher]
accepted = ["MPL-2.0"]
