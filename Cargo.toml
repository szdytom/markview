[package]
name = "markview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fast, native Markdown reader with publication-quality typography"
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["markdown", "reader", "desktop", "typography", "wgpu"]
categories = ["text-processing", "gui"]
publish = false

[lints]
workspace = true

# `publish = false` is about crates.io; dist still ships this binary.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "1094AD43-1728-41AA-A880-31382AA58F5B"
path-guid = "18EF2595-9338-4B1D-9262-A0D6438FF0F8"
license = false
eula = false

[workspace]
members = [
	"crates/markview-core",
	"crates/markview-i18n",
	"crates/markview-icon",
	"crates/markview-pdf",
	"crates/markview-render",
	"crates/markview-selection",
	"crates/markview-web",
	"xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.11"
edition = "2024"
# `krilla` sets the floor: the PDF backend needs newer standard-library items.
rust-version = "1.92"
license = "MIT"
readme = "README.md"
authors = ["szdytom"]
repository = "https://github.com/szdytom/markview"
homepage = "https://github.com/szdytom/markview"
documentation = "https://github.com/szdytom/markview/tree/main/docs"

[workspace.lints.rust]
# `deny`, not `forbid`: platform adapters use audited native calls, and a
# `forbid` cannot be lifted by a local `#[allow]`.
unsafe_code = "deny"

[workspace.dependencies]
regex = "1"
regex-automata = "0.4"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
unicode-segmentation = "1.13"
tempfile = "3"
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
log = "0.4"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
codex = { version = "0.3", default-features = false, features = ["numeral-systems"] }
comrak = { version = "0.55", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
hypher = { version = "0.1.7", default-features = false, features = ["english", "alloc"] }
icu_properties = "2.3"
icu_segmenter = "2.3"
krilla = { version = "0.8", default-features = false, features = ["raster-images", "rayon"] }
notify = "8.2"
open = "5.4"
parley = { version = "0.11.1", features = ["complex-scripts"] }
pollster = "0.4"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
rfd = "0.16"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.42"
swash = "0.2.9"
tiny-skia = "0.11"
# `std::time::Instant::now` panics on `wasm32-unknown-unknown`, so a library a
# browser drives takes its clock from here instead. On every other target
# this is `std::time` re-exported, so nothing changes there.
web-time = "1.1"
# Archive readers for downloadable font families. `zip` and `tar` are pure
# Rust; `zstd` compiles its own C sources, which the tree already does.
zip = { version = "8", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
zstd = { version = "0.13", default-features = false }
sha2 = "0.10"
# The download path needs a read timeout while it streams, which only the
# async `reqwest` client offers; one small runtime drives it.
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync", "fs", "io-util", "net"] }
clap = { version = "4", features = ["derive"] }
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "wgsl"] }
# The reader draws its own caption; do not initialize Adwaita decorations.
winit = { version = "0.30.13", default-features = false, features = ["rwh_06", "x11", "wayland", "wayland-dlopen"] }

[dependencies]
unicode-segmentation.workspace = true
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = "0.45"
# Library only: the default `cli` and `png` features would add a second
# `resvg`/`usvg` and `clap`, while Markview renders the SVG itself.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
percent-encoding = "2"
base64 = "0.22"
getrandom = { version = "0.4", features = ["std"] }
toml_edit = { version = "0.25", features = ["serde"] }
arboard.workspace = true
markview-core = { path = "crates/markview-core", features = ["font-directories"] }
markview-i18n = { path = "crates/markview-i18n" }
markview-icon = { path = "crates/markview-icon" }
markview-pdf = { path = "crates/markview-pdf" }
markview-render = { path = "crates/markview-render", features = ["readback"] }
markview-selection = { path = "crates/markview-selection" }
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
notify.workspace = true
open.workspace = true
pollster.workspace = true
clap.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
zip.workspace = true
zstd.workspace = true
rfd.workspace = true
sys-locale.workspace = true
swash.workspace = true
serde.workspace = true
serde_json.workspace = true
winit.workspace = true

tempfile.workspace = true

[dev-dependencies]
lopdf = { version = "0.45", default-features = false }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }
ico = "0.5"
# Direct Manipulation pans a precision touchpad with the OS's own inertia;
# winit initializes the COM apartment the viewport assembles in. The event
# handler macro expands to `::windows_core::` paths, so that crate is named
# here too.
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Graphics_DirectManipulation",
	"Win32_System_Com",
	"Win32_UI_Input_Pointer",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Console",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }
# A double-clicked document arrives as an Apple Event, which only the Objective-C
# runtime can answer; `winit` drives it for us but does not expose the hook.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
	"NSAppleEventDescriptor",
	"NSAppleEventManager",
	"NSNotification",
	"NSString",
	"std",
	"NSUserDefaults",
	"NSURL",
	"objc2-core-services",
] }
objc2-core-services = { version = "0.3", default-features = false, features = [
	"AE",
	"AEDataModel",
	"AppleEvents",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }


[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[[bin]]
name = "markview"
path = "src/main.rs"

# Temporary until a release carries the source-position fixes for fences,
# multiline inlines, front matter, tables, trailing blank
# lines in indented code blocks, and CRLF paragraphs before tables.
[patch.crates-io]
comrak = { git = "https://github.com/kivikakk/comrak", rev = "4127507465ee41e0a6298fd4b217b685a499af79" }
# Our fork adds `LayoutConfig::metrics`, which lets Markview measure diagram
# labels with the faces its own stylesheet selected (upstream PR #151). The rev
# below is the change based on v0.3.1, the release Markview's diagrams are
# validated against; the fork's `host-text-metrics` branch carries the same
# change rebased onto upstream master, and this rev stays reachable on the
# fork's `host-text-metrics-0.3.1` branch.
mermaid-rs-renderer = { git = "https://github.com/szdytom/mermaid-rs-renderer", rev = "8d540ab4994383b69d509868a5a2405b1da681f4" }
