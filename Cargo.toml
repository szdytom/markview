[package]
name = "markview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fast, native Markdown reader with publication-quality typography"
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["markdown", "reader", "desktop", "typography", "wgpu"]
categories = ["text-processing", "gui"]
publish = false

[lints]
workspace = true

# `publish = false` is about crates.io; dist still ships this binary.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "1094AD43-1728-41AA-A880-31382AA58F5B"
path-guid = "18EF2595-9338-4B1D-9262-A0D6438FF0F8"
license = false
eula = false

[workspace]
members = [
	"crates/markview-core",
	"crates/markview-icon",
	"crates/markview-pdf",
	"crates/markview-render",
	"xtask",
]
resolver = "3"

[workspace.package]
version = "0.1.3"
edition = "2024"
# `krilla` sets the floor: the PDF backend needs newer standard-library items.
rust-version = "1.92"
license = "MIT"
readme = "README.md"
authors = ["szdytom"]
repository = "https://github.com/szdytom/markview"
homepage = "https://github.com/szdytom/markview"
documentation = "https://github.com/szdytom/markview/tree/main/docs"

[workspace.lints.rust]
# `deny`, not `forbid`: `src/platform.rs` needs one `AttachConsole` call, and a
# `forbid` cannot be lifted by a local `#[allow]`.
unsafe_code = "deny"

[workspace.dependencies]
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
unicode-segmentation = "1.13"
tempfile = "3"
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
log = "0.4"
bytemuck = { version = "1", features = ["derive"] }
codex = { version = "0.3", default-features = false, features = ["numeral-systems"] }
comrak = { version = "0.55", default-features = false }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
hypher = { version = "0.1.7", default-features = false, features = ["english", "alloc"] }
icu_properties = "2.3"
icu_segmenter = "2.3"
krilla = { version = "0.8", default-features = false, features = ["raster-images"] }
notify = "8.2"
open = "5.4"
parley = { version = "0.11.1", features = ["complex-scripts"] }
pollster = "0.4"
ratex-parser = "=0.1.14"
ratex-layout = "=0.1.14"
ratex-types = "=0.1.14"
ratex-font = "=0.1.14"
ratex-katex-fonts = "=0.1.14"
rfd = "0.16"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.42"
swash = "0.2.9"
tiny-skia = "0.11"
wgpu = { version = "29.0.4", default-features = false, features = ["std", "parking_lot", "wgsl"] }
winit = "0.30.13"

[dependencies]
unicode-segmentation.workspace = true
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = "0.45"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
url = "2"
percent-encoding = "2"
base64 = "0.22"
toml_edit = { version = "0.25", features = ["serde"] }
arboard.workspace = true
markview-core = { path = "crates/markview-core" }
markview-icon = { path = "crates/markview-icon" }
markview-pdf = { path = "crates/markview-pdf" }
markview-render = { path = "crates/markview-render" }
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
notify.workspace = true
open.workspace = true
pollster.workspace = true
rfd.workspace = true
sys-locale.workspace = true
serde.workspace = true
serde_json.workspace = true
winit.workspace = true

tempfile.workspace = true

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }
ico = "0.5"
windows-sys = { version = "0.61", features = ["Win32_System_Console"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }


[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[[bin]]
name = "markview"
path = "src/main.rs"

# Temporary until a release carries the fix; see `fence_offset` in comrak's
# block prefix parsers (upstream PR #836).
[patch.crates-io]
comrak = { git = "https://github.com/kivikakk/comrak", rev = "cf8955abe961454dff39cfb64952e1933645d870" }
