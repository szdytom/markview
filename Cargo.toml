[package]
name = "markview"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "A fast, native Markdown reader with publication-quality typography"
authors.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
documentation.workspace = true
keywords = ["markdown", "reader", "desktop", "typography", "wgpu"]
categories = ["text-processing", "gui"]
publish = false

[lib]
crate-type = ["rlib", "cdylib"]

[lints]
workspace = true

# `publish = false` is about crates.io; dist still ships this binary.
[package.metadata.dist]
dist = true

[package.metadata.wix]
upgrade-guid = "1094AD43-1728-41AA-A880-31382AA58F5B"
path-guid = "18EF2595-9338-4B1D-9262-A0D6438FF0F8"
license = false
eula = false

[workspace]
members = [
	"crates/markview-commonmark",
	"crates/markview-document",
	"crates/markview-font-archive",
	"crates/markview-geometry",
	"crates/markview-i18n",
	"crates/markview-icon",
	"crates/markview-image",
	"crates/markview-interaction",
	"crates/markview-layout",
	"crates/markview-pdf",
	"crates/markview-platform",
	"crates/markview-render",
	"crates/markview-ui-core",
	"crates/markview-webpage",
	"crates/markview-web",
	"xtask",
]
resolver = "3"

[workspace.package]
version = "0.5.1"
edition = "2024"
# Minimum supported toolchain for the workspace.
rust-version = "1.96"
license = "MIT"
readme = "README.md"
authors = ["szdytom"]
repository = "https://github.com/szdytom/markview"
homepage = "https://github.com/szdytom/markview"
documentation = "https://github.com/szdytom/markview/tree/main/docs"

[workspace.lints.rust]
# `deny`, not `forbid`: platform adapters use audited native calls, and a
# `forbid` cannot be lifted by a local `#[allow]`.
unsafe_code = "deny"

[workspace.metadata.lint]
cyclomatic-complexity-threshold = 15

[workspace.dependencies]
proptest = { version = "1.12", default-features = false, features = ["std"] }
regex = "1"
regex-automata = "0.4"
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
unicode-segmentation = "1.13"
tempfile = "3"
anyhow = "1"
env_logger = { version = "0.11", default-features = false }
log = "0.4"
memmap2 = "0.9"
bytemuck = { version = "1", features = ["derive"] }
codex = { version = "0.3", default-features = false, features = ["numeral-systems"] }
# Validate source-map compatibility before advancing to another prerelease.
comrak = { version = "=1.0.0-rc.1", default-features = false, features = ["grid_table"] }
syntect = { version = "5.3", default-features = false, features = ["parsing", "regex-fancy"] }
two-face = { version = "0.5.1", default-features = false, features = ["syntect-fancy"] }
hypher = { version = "0.1.7", default-features = false, features = ["english", "alloc"] }
icu_properties = "2.3"
icu_segmenter = "2.3"
krilla = { version = "0.8", default-features = false, features = ["raster-images", "rayon"] }
notify = "8.2"
open = "5.4.5"
parley = { version = "0.12.0", features = ["complex-scripts"] }
pollster = "1"
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
ratex-font = "=0.1.15"
ratex-katex-fonts = "=0.1.15"
# The pinned fork adds the non-serializing `Readability::extract` entry point
# and re-exports `dom_query`, so both the webpage front end and the benchmark
# use one versioned DOM API.
dom_smoothie = "0.19"
# `ratex-katex-fonts` otherwise reads the build machine's files in debug builds.
rust-embed = { version = "8.11", features = ["debug-embed"] }
rfd = "0.16"
sys-locale = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skrifa = "0.42"
swash = "0.2.9"
tiny-skia = "0.12"
# `std::time::Instant::now` panics on `wasm32-unknown-unknown`, so a library a
# browser drives takes its clock from here instead. On every other target
# this is `std::time` re-exported, so nothing changes there.
web-time = "1.1"
# Archive readers for downloadable font families. `zip` and `tar` are pure
# Rust; `zstd` compiles its own C sources, which the tree already does.
zip = { version = "9", default-features = false, features = ["deflate"] }
tar = "0.4"
flate2 = "1"
zstd = { version = "0.14", default-features = false }
sha2 = "0.11"
# The download path needs a read timeout while it streams, which only the
# async `reqwest` client offers; one small runtime drives it.
tokio = { version = "1", default-features = false, features = ["rt", "time", "macros", "sync", "fs", "io-util", "net"] }
clap = { version = "4", features = ["derive"] }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "parking_lot", "wgsl"] }
# The reader draws its own caption; do not initialize Adwaita decorations.
winit = { version = "=0.31.0-beta.4", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }

[features]
default = ["parallel-layout"]
parallel-layout = ["markview-layout/parallel"]
# Developer-only measurement subcommands: bench, latency and smoke.
diagnostics = []

[dependencies]
markview-commonmark = { path = "crates/markview-commonmark" }
markview-document = { path = "crates/markview-document" }
comrak.workspace = true
unicode-segmentation.workspace = true
image = { version = "0.25.9", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
resvg = "0.49"
# Roboto Flex on Android needs more than `ttf-parser`'s 32 stack tuples.
ttf-parser = { version = "0.25", features = ["gvar-alloc"] }
# Library only: the default `cli` and `png` features would add a second
# `resvg`/`usvg` and `clap`, while Markview renders the SVG itself.
mermaid-rs-renderer = { version = "0.3.1", default-features = false }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "socks"] }
futures-util = "0.3"
tokio-util = { version = "0.7", features = ["rt"] }
url = "2"
percent-encoding = "2"
base64 = "0.23"
getrandom = { version = "0.4", features = ["std"] }
toml_edit = { version = "0.25", features = ["serde"] }
parley.workspace = true
markview-layout = { path = "crates/markview-layout", features = ["font-directories"] }
markview-webpage = { path = "crates/markview-webpage" }
markview-i18n = { path = "crates/markview-i18n" }
markview-icon = { path = "crates/markview-icon" }
markview-image = { path = "crates/markview-image" }
markview-font-archive = { path = "crates/markview-font-archive" }
markview-interaction = { path = "crates/markview-interaction" }
markview-pdf = { path = "crates/markview-pdf" }
markview-platform = { path = "crates/markview-platform" }
markview-render = { path = "crates/markview-render", features = ["readback"] }
markview-ui-core = { path = "crates/markview-ui-core" }
anyhow.workspace = true
env_logger.workspace = true
log.workspace = true
pollster.workspace = true
clap.workspace = true
flate2.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
zip.workspace = true
zstd.workspace = true
swash.workspace = true
serde.workspace = true
serde_json.workspace = true
winit.workspace = true

tempfile.workspace = true
nucleo-matcher = "0.3.1"

[dev-dependencies]
proptest.workspace = true
markview-platform = { path = "crates/markview-platform", features = ["test-support"] }
lopdf = { version = "0.46", default-features = false }
# `examples/webpage_bench.rs` replays the old Readability-to-Markdown pipeline;
# production code lowers the processed DOM through `markview-webpage`.
dom_smoothie.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
wgpu = { workspace = true, features = ["vulkan", "gles"] }

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { workspace = true, features = ["dx12"] }

[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = { version = "0.1", default-features = false }

[target.'cfg(target_os = "linux")'.dependencies]
wgpu = { workspace = true, features = ["vulkan"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { workspace = true, features = ["metal"] }


[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"

[[bin]]
name = "markview"
path = "src/main.rs"

[patch.crates-io]
# `dom_smoothie` 0.19.0 plus the non-serializing DOM extraction API merged
# upstream in #246. Remove this patch once a locked release provides the same
# API; see `docs/developers/webpage-extraction.md`.
dom_smoothie = { git = "https://github.com/niklak/dom_smoothie", rev = "0fdbefd324d6ba49b4bbdadc85b2a25cc4367b76" }
# Preserve Android activity destruction/recreation and avoid waiting after Windows loop exit.
winit = { git = "https://github.com/szdytom/winit", rev = "3f8aa0f0c18e88e416e86d842226c8fe46884894" }
# Our fork adds `LayoutConfig::metrics`, which lets Markview measure diagram
# labels with the faces its own stylesheet selected (upstream PR #151). The rev
# below is the change based on v0.3.1, the release Markview's diagrams are
# validated against; the fork's `host-text-metrics` branch carries the same
# change rebased onto upstream master, and this rev stays reachable on the
# fork's `host-text-metrics-0.3.1` branch.
mermaid-rs-renderer = { git = "https://github.com/szdytom/mermaid-rs-renderer", rev = "8d540ab4994383b69d509868a5a2405b1da681f4" }
