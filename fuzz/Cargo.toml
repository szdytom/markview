[package]
name = "markview-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone workspace: the fuzz crate must not leak into the root workspace's
# build or its dependency graph (F1).
[workspace]
members = ["fuzzlib"]

[dependencies]
markview-commonmark = { path = "../crates/markview-commonmark" }
markview-document = { path = "../crates/markview-document" }
markview-webpage = { path = "../crates/markview-webpage" }
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
lopdf = { version = "0.46", default-features = false }
markview-layout = { path = "../crates/markview-layout", features = ["fuzz"] }
markview-pdf = { path = "../crates/markview-pdf", features = ["fuzz"] }
markview-render = { path = "../crates/markview-render", features = ["fuzz"] }
mvfuzz = { path = "fuzzlib" }
tempfile = "3"

# Overflow checks stay on (the `dev` default): an integer overflow in a
# fuzzed path panics and becomes a regression test (O1).
[profile.dev]
opt-level = 3
debug = "line-tables-only"
[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3
debug = "line-tables-only"
[profile.release.package."*"]
opt-level = 3

# G1: parsing and incremental entry points (Tier 1).
[[bin]]
name = "parse"
path = "fuzz_targets/parse.rs"
test = false
doc = false
bench = false

# G1/G3: incremental reparse versus full parse (Tier 3 differential).
[[bin]]
name = "reparse"
path = "fuzz_targets/reparse.rs"
test = false
doc = false
bench = false

# G1: a prefix parse versus the start of the full parse (Tier 3 differential).
[[bin]]
name = "prefix"
path = "fuzz_targets/prefix.rs"
test = false
doc = false
bench = false

# G2: MVSS stylesheet parsing (Tier 1).
[[bin]]
name = "mvss"
path = "fuzz_targets/mvss.rs"
test = false
doc = false
bench = false

# G3: the layout pipeline (Tier 1).
[[bin]]
name = "layout"
path = "fuzz_targets/layout.rs"
test = false
doc = false
bench = false

# G3: cached vs uncached and prefix vs final snapshots (Tier 3 differential).
[[bin]]
name = "layout_diff"
path = "fuzz_targets/layout_diff.rs"
test = false
doc = false
bench = false

# G3: serial versus native parallel block layout (Tier 3 differential).
[[bin]]
name = "layout_parallel"
path = "fuzz_targets/layout_parallel.rs"
test = false
doc = false
bench = false

# G4: math through ratex (Tier 1 + Tier 2).
[[bin]]
name = "math"
path = "fuzz_targets/math.rs"
test = false
doc = false
bench = false

# G4: syntax highlighting through syntect (Tier 1 + Tier 2).
[[bin]]
name = "highlight"
path = "fuzz_targets/highlight.rs"
test = false
doc = false
bench = false

# G5: text shaping (Tier 1 + Tier 2).
[[bin]]
name = "shaping"
path = "fuzz_targets/shaping.rs"
test = false
doc = false
bench = false

# G5: font byte and directory validation (Tier 1 + Tier 2).
[[bin]]
name = "fonts"
path = "fuzz_targets/fonts.rs"
test = false
doc = false
bench = false

# G6: PDF export with byte determinism and a structured readback (Tier 1 +
# Tier 2 + Tier 3).
[[bin]]
name = "pdf"
path = "fuzz_targets/pdf.rs"
test = false
doc = false
bench = false

# G7: the renderer's GPU-free geometry (Tier 1 + Tier 3).
[[bin]]
name = "geometry"
path = "fuzz_targets/geometry.rs"
test = false
doc = false
bench = false

# G1: reference-definition resolution against an independent source scan
# (Tier 3).
[[bin]]
name = "refdef"
path = "fuzz_targets/refdef.rs"
test = false
doc = false
bench = false

# G1: a node's source range must cover text that belongs to it (Tier 3).
[[bin]]
name = "sourcepos_content"
path = "fuzz_targets/sourcepos_content.rs"
test = false
doc = false
bench = false

# G1: the `<details>` element the tree built must enclose the tags the source
# wrote (Tier 3).
[[bin]]
name = "details_structure"
path = "fuzz_targets/details_structure.rs"
test = false
doc = false
bench = false

# G1: a fragment target must be reachable through the disclosures that frame
# it, and land in the block that declares it (Tier 3).
[[bin]]
name = "anchors"
path = "fuzz_targets/anchors.rs"
test = false
doc = false
bench = false

# G8: HTML-to-document extraction (Tier 1 + Tier 3).
[[bin]]
name = "webpage"
path = "fuzz_targets/webpage.rs"
test = false
doc = false
bench = false

# G8: a generated article's semantics against the lowering (Tier 3
# differential).
[[bin]]
name = "webpage_seam"
path = "fuzz_targets/webpage_seam.rs"
test = false
doc = false
bench = false

[patch.crates-io]
# The webpage target lowers through the same `dom_smoothie` fork the reader
# pins; upstream 0.19 does not carry the non-serializing extraction API. This
# must track the root workspace's patch, or the harness would fuzz a different
# extractor than the app ships.
dom_smoothie = { git = "https://github.com/szdytom/dom_smoothie", rev = "66efad3292bedb89d4510da057260ffc9f6d83da" }
