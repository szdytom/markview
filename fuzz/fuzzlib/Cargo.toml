[package]
name = "mvfuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.96"
publish = false


[dependencies]
markview-commonmark = { path = "../../crates/markview-commonmark" }
markview-document = { path = "../../crates/markview-document" }
markview-webpage = { path = "../../crates/markview-webpage" }
# The webpage oracles check resolved addresses with the same URL parser the
# lowering uses, so a link the reader cannot open is caught as such.
url = "2"

libfuzzer-sys = "0.4"
# `font-directories` is named here because this crate is the one that reads
# `tests/fonts` (see `pipeline::pinned_fonts`). It happens to arrive through
# `markview-pdf` today, but a layout helper that only works because another
# crate enables a feature is one refactor away from shaping with no faces.
markview-layout = { path = "../../crates/markview-layout", features = ["fuzz", "font-directories", "parallel"] }
markview-pdf = { path = "../../crates/markview-pdf", features = ["fuzz"] }
# The PDF targets re-parse Markview's own output; the reader dependency carries
# the same version, so the harness checks what a viewer would see.
lopdf = { version = "0.46", default-features = false }
# The PDF link oracle decodes an in-document anchor the same way
# `markview-pdf::link` does before looking it up in the pagination.
percent-encoding = "2"
# The PDF text oracle asks the committed test faces' character maps which
# code points they can draw, so an undrawable glyph is not read as a dropped
# character.
swash = "0.2.9"
# `mathprobe` measures ratex directly, below `markview-layout`'s byte budgets, so
# it needs the three crates the reader pins. Same versions as the root
# workspace; a divergence here would measure a different ratex than the app
# ships.
ratex-parser = "=0.1.15"
ratex-layout = "=0.1.15"
ratex-types = "=0.1.15"
