name: Fuzz
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# F6: check the libraries and oracles alongside sharded ASAN smoke runs.
# Campaigns stay local, recorded under artifacts/ (R2, R3).
jobs:
  check:
    name: Libraries and oracles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The harness's formatting and lint gates run on stable, like the root
      # workspace's, so a new nightly lint cannot turn this job red overnight.
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-check
          workspaces: |
            . -> target
            fuzz -> target
      - name: Linux native development libraries
        run: bash scripts/ci_install_packages.sh libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # The fuzz crate is its own workspace with its own lockfile, so a stale
      # `fuzz/Cargo.lock` must fail here instead of being rewritten by the build.
      - name: Verify the fuzz lockfile
        working-directory: fuzz
        run: cargo +nightly metadata --locked --format-version 1 > /dev/null
      # The root workspace's `cargo fmt` and `cargo clippy` never see this
      # crate, so the standalone workspace carries its own gate. Name both
      # packages: a bare `--all` from `fuzz/` reaches the root workspace.
      - name: Format the harness
        working-directory: fuzz
        run: cargo +stable fmt -p markview-fuzz -p mvfuzz -- --check
      - name: Lint the harness
        working-directory: fuzz
        run: cargo +stable clippy --workspace --all-targets --locked -- -D warnings
      # The `fuzz` feature must stay a visibility relaxation only: it
      # compiles in every configuration the libraries support (F5).
      - run: cargo check -p markview-commonmark -p markview-document -p markview-layout -p markview-pdf -p markview-render --features fuzz --locked
      - name: Test differential oracles
        working-directory: fuzz
        run: cargo +nightly test -p mvfuzz --locked
      - name: Preserve document memory behavior differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: document-memory-differences
          path: artifacts/doc-memory-regression/
          if-no-files-found: ignore

  smoke:
    name: ASAN smoke (${{ matrix.group }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - group: syntax
            targets: parse prefix reparse refdef sourcepos_content details_structure anchors mvss reading_pipeline
          - group: layout
            targets: layout layout_diff layout_parallel geometry shaping
          - group: web
            targets: webpage webpage_seam webpage_layout image_decode fonts font_archive
          - group: output
            targets: math highlight highlight_schedule pdf paginate_pipeline interaction_sequence
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: fuzz-smoke-${{ matrix.group }}
          workspaces: fuzz -> target
      - name: Linux native development libraries
        run: bash scripts/ci_install_packages.sh libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - name: Verify the fuzz lockfile
        working-directory: fuzz
        run: cargo +nightly metadata --locked --format-version 1 > /dev/null
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      # Seeds from the official specs so the smoke covers real documents.
      - name: Prepare seed corpora
        working-directory: fuzz
        run: ./scripts/prepare_seeds.sh
      # `fuzz run` builds each selected target with ASAN before running it.
      # Leak detection stays off: fontconfig's C caches outlive the process.
      - name: Build and smoke selected targets (ASAN)
        working-directory: fuzz
        run: |
          read -r -a targets <<< "$FUZZ_TARGETS"
          for target in "${targets[@]}"; do
            cargo +nightly fuzz run "$target" -- -runs=100
          done
        env:
          FUZZ_TARGETS: ${{ matrix.targets }}
          ASAN_OPTIONS: detect_leaks=0
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/fontconfig.conf
