name: Fuzz
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
# F6: prove the harness compiles and the library's `fuzz` feature builds,
# then one brief smoke per a couple of targets. No campaigns in CI: the
# corpora and long runs are local, recorded under artifacts/ (R2, R3).
jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ github.ref }}-fuzz
      - name: Linux native development libraries
        run: bash scripts/ci_install_packages.sh libfontconfig1-dev libxkbcommon-dev libwayland-dev
      # The fuzz crate is its own workspace with its own lockfile, so a stale
      # `fuzz/Cargo.lock` must fail here instead of being rewritten by the build.
      - name: Verify the fuzz lockfile
        working-directory: fuzz
        run: cargo +nightly metadata --locked --format-version 1 > /dev/null
      # The `fuzz` feature must stay a visibility relaxation only: it
      # compiles in every configuration the libraries support (F5).
      - run: cargo check -p markview-commonmark -p markview-document -p markview-layout -p markview-pdf -p markview-render --features fuzz --locked
      - name: Install cargo-fuzz
        run: cargo +nightly install cargo-fuzz --locked
      - name: Build all harness targets (ASAN)
        working-directory: fuzz
        run: cargo +nightly fuzz build
      - name: Test differential oracles
        working-directory: fuzz
        run: cargo +nightly test -p mvfuzz --locked
      - name: Preserve document memory behavior differences
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: document-memory-differences
          path: artifacts/doc-memory-regression/
          if-no-files-found: ignore
      # Seeds from the official specs so the smoke covers real documents.
      - name: Prepare seed corpora
        working-directory: fuzz
        run: ./scripts/prepare_seeds.sh
      # Smoke: a handful of inputs per target against the seed corpus.
      # Leak detection stays off: fontconfig's C caches outlive the process.
      - name: Smoke run
        working-directory: fuzz
        run: |
          for target in parse prefix reparse refdef sourcepos_content details_structure anchors mvss layout layout_diff layout_parallel math highlight highlight_schedule shaping fonts geometry pdf reading_pipeline webpage webpage_seam webpage_layout paginate_pipeline image_decode interaction_sequence font_archive; do
            ASAN_OPTIONS=detect_leaks=0 cargo +nightly fuzz run $target -- -runs=100
          done
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/fontconfig.conf
