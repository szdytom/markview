name: Golden tests
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/cache@v6
        with:
          path: ~/.cache/markview/render
          key: ${{ runner.os }}-render-${{ hashFiles('ci/render/image') }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: ${{ runner.os }}-render-${{ hashFiles('ci/render/image') }}-
      - name: Run rendering baselines
        run: bash scripts/render-env.sh
        env:
          MARKVIEW_CONTAINER_ENGINE: docker
      - name: Upload rendered test frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: golden-test-frames-${{ runner.os }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
