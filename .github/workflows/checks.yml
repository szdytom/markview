name: Checks
on:
  workflow_call:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: "0"
  # Keep CI artifacts small without changing local development profiles.
  CARGO_PROFILE_DEV_DEBUG: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"
jobs:
  msrv:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - name: Install native libraries
        run: bash scripts/ci_install_packages.sh libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo check --workspace --locked --all-targets

  static:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check
      - name: Application platform boundary
        run: |
          python3 scripts/check_platform_boundary.py
          python3 -m unittest discover -s scripts -p test_check_platform_boundary.py
      - uses: Swatinem/rust-cache@v2
      # These source audits inspect all platform branches on a single runner.
      - name: Rust cyclomatic complexity
        run: cargo run -p xtask --locked -- complexity
      - name: Application coupling
        run: cargo run -p xtask --locked -- coupling --check

  lint:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install native libraries
        if: runner.os == 'Linux'
        run: bash scripts/ci_install_packages.sh libfontconfig1-dev libxkbcommon-dev libwayland-dev
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Lavapipe executes the real Vulkan renderer without a physical GPU.
      - name: Linux native libraries and software rendering
        if: runner.os == 'Linux'
        run: |
          bash scripts/ci_install_packages.sh libfontconfig1-dev libxkbcommon-dev libwayland-dev vulkan-tools \
            poppler-utils=24.02.0-1ubuntu9.11 libpoppler134=24.02.0-1ubuntu9.11 \
            mesa-vulkan-drivers=25.2.8-0ubuntu0.24.04.4 libllvm20=1:20.1.2-0ubuntu1~24.04.3
          driver=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)
          test -n "$driver"
          printf '%s\n' "VK_DRIVER_FILES=$driver" "WGPU_BACKEND=vulkan" "LP_NUM_THREADS=1" >> "$GITHUB_ENV"
          VK_DRIVER_FILES="$driver" vulkaninfo --summary
      # Keep the non-Linux search GPU assertions in the regular suite.
      - name: Run regular tests
        run: >-
          cargo test --workspace --locked --all-targets --
          --skip proptests::
          ${{ runner.os == 'Linux' && '--skip rendering_baselines' || '' }}
        env:
          # Linux sees no installed fonts, so missing test configuration fails.
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/fontconfig.conf
      - name: Upload rendered test frames
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: rendered-test-frames-${{ runner.os }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 3
      - name: PDF viewer regressions
        if: runner.os == 'Linux'
        run: cargo test -p markview-pdf --locked --test export -- --ignored
        env:
          FONTCONFIG_FILE: ${{ github.workspace }}/tests/fontconfig.conf
