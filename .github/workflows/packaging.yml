name: Packaging

# `release:` events do not fire for releases created with GITHUB_TOKEN, so this
# workflow chains off the dist-generated "Release" workflow finishing instead.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]

permissions:
  contents: write

jobs:
  linux-extra:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Fetch the release archive
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --pattern 'markview-x86_64-unknown-linux-gnu.tar.gz' \
            --dir dist
          tar -xzf dist/*.tar.gz -C dist
      - name: Check the release version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          tag_version=${TAG#v}
          test "$version" = "$tag_version" || {
            echo "Cargo.toml version $version does not match tag $TAG" >&2
            exit 1
          }
          test "$(./dist/markview --help | head -1 | cut -d' ' -f1)" = "Markview" || {
            echo "the downloaded archive is not a runnable markview binary" >&2
            exit 1
          }
      - name: Generate third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked
          cargo about generate packaging/about.hbs \
            -o "$RUNNER_TEMP/third-party-notices.html"
      - name: Build the Debian package
        env:
          MARKVIEW_NOTICES: ${{ runner.temp }}/third-party-notices.html
        run: |
          version=${TAG#v}
          scripts/package_deb.sh ./dist/markview "$version" amd64 out
      - name: Build the AppImage
        run: |
          version=${TAG#v}
          scripts/package_appimage.sh ./dist/markview "$version" out
          sha256sum out/*.AppImage >out/markview.AppImage.sha256
      - name: Attach the packages
        run: gh release upload "$TAG" out/* --clobber

  macos-app:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ github.event.workflow_run.head_branch }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}
      - name: Fetch the release archive
        run: |
          mkdir -p dist
          gh release download "$TAG" \
            --pattern 'markview-aarch64-apple-darwin.tar.gz' \
            --dir dist
          tar -xzf dist/*.tar.gz -C dist
      - name: Build the application bundle
        run: |
          version=${TAG#v}
          scripts/package_macos_app.sh ./dist "$version" out
          shasum -a 256 out/*.zip >out/markview.app.zip.sha256
      - name: Attach the bundle
        run: gh release upload "$TAG" out/* --clobber
