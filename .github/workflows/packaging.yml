name: Packaging

# Attaches the assets cargo-dist does not build: a Debian package, an AppImage,
# and a macOS application bundle.
#
# Archives come from the "Release" run's own artifacts rather than from the
# published release, so a build can be packaged before any release exists:
#
#   gh workflow run Packaging \
#     --ref BRANCH -f dist_run=RUN_ID -f ref=BRANCH -f publish=false
#
# With `publish=false` the packages are uploaded as workflow artifacts and no
# release is touched. `publish=true` requires the release for that tag to
# already exist. `release:` events do not fire for releases created with
# GITHUB_TOKEN, so the automatic path chains off the "Release" workflow
# finishing instead.
on:
  workflow_run:
    workflows: ["Release"]
    types: [completed]
  workflow_dispatch:
    inputs:
      dist_run:
        description: Run id of a Release workflow run to package
        required: true
        type: string
      ref:
        description: Tag or branch that run was built from
        required: true
        type: string
      publish:
        description: Attach the packages to the GitHub release for that tag
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  linux-extra:
    # A manual run packages whatever it is pointed at; an automatic run only
    # follows a successful release of a version tag.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: ubuntu-22.04
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_RUN: ${{ github.event.workflow_run.id || github.event.inputs.dist_run }}
      REF: ${{ github.event.workflow_run.head_branch || github.event.inputs.ref }}
      # A manual dry run must not touch a release.
      PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref }}
      - id: version
        name: Read the workspace version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version" || {
            echo "cannot read the workspace version" >&2
            exit 1
          }
          if [[ "$PUBLISH" == "true" ]]; then
            test "$REF" = "v$version" || {
              echo "release tag $REF does not match version $version" >&2
              exit 1
            }
          fi
          echo "value=$version" >>"$GITHUB_OUTPUT"
      - name: Fetch the release archive
        run: |
          mkdir -p dist
          gh run download "$DIST_RUN" \
            --pattern artifacts-build-local-x86_64-unknown-linux-gnu \
            --dir dist
          tar -xzf dist/*.tar.gz -C dist --strip-components=1
      - name: Validate the archive
        run: |
          test "$(./dist/markview --help | head -1 | cut -d' ' -f1)" = "Markview" || {
            echo "the downloaded archive is not a runnable markview binary" >&2
            exit 1
          }
      - name: Generate third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo about generate packaging/about.hbs \
            -o "$RUNNER_TEMP/third-party-notices.html"
      - name: Build the Debian package
        env:
          MARKVIEW_NOTICES: ${{ runner.temp }}/third-party-notices.html
        run: |
          scripts/package_deb.sh ./dist/markview \
            "${{ steps.version.outputs.value }}" amd64 out
      - name: Build the AppImage
        run: |
          scripts/package_appimage.sh ./dist/markview \
            "${{ steps.version.outputs.value }}" out
          sha256sum out/*.AppImage >out/markview.AppImage.sha256
      - name: Attach the packages
        if: env.PUBLISH == 'true'
        run: gh release upload "$REF" out/* --clobber
      - name: Keep the packages
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: markview-linux-packages
          path: out/*
          retention-days: 14

  macos-app:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'v'))
    runs-on: macos-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIST_RUN: ${{ github.event.workflow_run.id || github.event.inputs.dist_run }}
      REF: ${{ github.event.workflow_run.head_branch || github.event.inputs.ref }}
      PUBLISH: ${{ github.event_name == 'workflow_run' || inputs.publish }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.event.inputs.ref }}
      - name: Read the workspace version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          test -n "$version" || {
            echo "cannot read the workspace version" >&2
            exit 1
          }
          echo "value=$version" >>"$GITHUB_OUTPUT"
      - name: Fetch the release archive
        run: |
          mkdir -p dist
          gh run download "$DIST_RUN" \
            --pattern artifacts-build-local-aarch64-apple-darwin \
            --dir dist
          tar -xzf dist/*.tar.gz -C dist --strip-components=1
      - name: Build the application bundle
        run: |
          scripts/package_macos_app.sh ./dist \
            "${{ steps.version.outputs.value }}" out
          shasum -a 256 out/*.zip >out/markview.app.zip.sha256
      - name: Attach the bundle
        if: env.PUBLISH == 'true'
        run: gh release upload "$REF" out/* --clobber
      - name: Keep the bundle
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: markview-macos-app
          path: out/*
          retention-days: 14
