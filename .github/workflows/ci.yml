name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Linux fonts and native development libraries
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev libwayland-dev fonts-noto-core fonts-noto-cjk
      - run: cargo check --workspace --locked --all-targets
      - run: cargo test --workspace --locked --all-targets
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --locked --all-targets -- -D warnings

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install packaging tools
        run: |
          cargo install cargo-dist --version 0.32.0 --locked
          # `cargo install` lands in ~/.cargo/bin, which later steps need on PATH.
          echo "$HOME/.cargo/bin" >>"$GITHUB_PATH"
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint the workflows we own
        # `release.yml` is generated by cargo-dist and cannot be hand-edited, so
        # its shellcheck findings are not actionable here. shellcheck is already
        # installed, so actionlint also checks the scripts inside `run:` blocks.
        run: |
          bash <(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/ci.yml \
            .github/workflows/packaging.yml
      - name: Generated release files match the configuration
        # `cargo install cargo-dist` installs the bare `dist` binary, which
        # cargo will not resolve as a subcommand.
        run: |
          dist generate --check
          dist plan
      - name: Committed icons match the source SVG
        run: cargo run -p xtask -- icons --check
      - name: Packaging scripts are sound
        run: shellcheck scripts/package_*.sh

  # Builds every installable package on each platform and keeps them as
  # workflow artifacts. This is the pre-release check: it never publishes
  # anything, so a failure leaves no release behind.
  packages-linux:
    needs: check
    # 22.04 keeps the archive usable on glibc 2.35, matching dist-workspace.toml.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev
      - name: Build the local archive
        run: |
          cargo install cargo-dist --version 0.32.0 --locked
          dist build --artifacts=local --target x86_64-unknown-linux-gnu
      - name: Extract the archive
        run: |
          mkdir -p dist
          tar -xzf target/distrib/markview-x86_64-unknown-linux-gnu.tar.gz \
            -C dist --strip-components=1
          ./dist/markview --help | head -1
      - name: Generate third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo-about generate packaging/about.hbs -o third-party-notices.html
      - name: Build the Debian package and the AppImage
        env:
          MARKVIEW_NOTICES: ${{ github.workspace }}/third-party-notices.html
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p out
          cp target/distrib/markview-x86_64-unknown-linux-gnu.tar.gz* out/
          scripts/package_deb.sh ./dist/markview "$version" amd64 out
          scripts/package_appimage.sh ./dist/markview "$version" out
          (cd out && sha256sum ./* >SHA256SUMS)
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: markview-linux-packages
          path: out/*
          if-no-files-found: error

  packages-windows:
    needs: check
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the archive and the MSI
        shell: bash
        run: |
          cargo install cargo-dist --version 0.32.0 --locked
          dist build --artifacts=local --target x86_64-pc-windows-msvc
      - name: Inspect the MSI
        shell: pwsh
        run: |
          $msi = Get-ChildItem target/distrib/*.msi
          if (-not $msi) { throw "no MSI was produced" }
          $msi | ForEach-Object { Write-Host $_.FullName $_.Length }
          $zip = Get-ChildItem target/distrib/*.zip
          if (-not $zip) { throw "no portable archive was produced" }
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: markview-windows-packages
          path: |
            target/distrib/*.msi
            target/distrib/*.zip
            target/distrib/*.sha256
          if-no-files-found: error

  packages-macos:
    needs: check
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build the archive
        run: |
          cargo install cargo-dist --version 0.32.0 --locked
          dist build --artifacts=local --target aarch64-apple-darwin
      - name: Extract the archive
        run: |
          mkdir -p dist
          tar -xzf target/distrib/markview-aarch64-apple-darwin.tar.gz -C dist --strip-components=1
          ./dist/markview --help | head -1
      - name: Build the application bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p out
          cp target/distrib/markview-aarch64-apple-darwin.tar.gz* out/
          scripts/package_macos_app.sh ./dist "$version" out
          (cd out && shasum -a 256 ./* >SHA256SUMS)
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: markview-macos-packages
          path: out/*
          if-no-files-found: error

  # A single required status check for branch protection.
  ci:
    if: always()
    needs: [check, packaging, packages-linux, packages-windows, packages-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
