name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/checks.yml

  fuzz:
    uses: ./.github/workflows/fuzz.yml

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-dist
      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck
      - name: Lint the workflows we own
        # `release.yml` is generated by cargo-dist and cannot be hand-edited, so
        # its shellcheck findings are not actionable here. shellcheck is already
        # installed, so actionlint also checks the scripts inside `run:` blocks.
        run: |
          bash <(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/ci.yml \
            .github/workflows/packages.yml .github/workflows/packaging.yml \
            .github/workflows/release-notes.yml \
            .github/workflows/winget.yml \
            .github/workflows/checks.yml .github/workflows/fuzz.yml
      - name: Generated release files match the configuration
        # `cargo install cargo-dist` installs the bare `dist` binary, which
        # cargo will not resolve as a subcommand.
        run: |
          dist generate --check
          dist plan
      - name: Release notes use the desktop packages
        run: python3 -m unittest discover -s scripts -p 'test_render_release_notes.py'
      - name: Committed icons match the source SVG
        run: cargo run -p xtask -- icons --check
      - name: Shell scripts are sound
        run: shellcheck scripts/build-web.sh scripts/package_*.sh scripts/verify_*.sh

  winget:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Install WinGet
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Install-Module Microsoft.WinGet.Client -Repository PSGallery -Force -Scope CurrentUser
          Repair-WinGetPackageManager -AllUsers -Latest -Force
          winget --version
      - name: Validate and install the WinGet package
        shell: pwsh
        run: ./scripts/verify_winget_package.ps1

  # The browser front end shares the engine but not its build: a `wasm32`
  # compile, the pinned `wasm-bindgen` CLI, the pnpm monorepo under `web/` and
  # the Playwright suite that drives the built demo. Nothing here is filtered by
  # path, because the engine, the stylesheets and the committed subset faces all
  # feed it, and a skipped job would leave the required `ci` check green.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
      # The CLI must equal the `wasm-bindgen` crate pinned in
      # `crates/markview-web/Cargo.toml`, or it refuses the module's schema.
      # `rust-cache` keeps `~/.cargo/bin`, so a restored binary skips the
      # compile and only a cold cache pays for it.
      - name: Install the wasm-bindgen CLI
        run: |
          if [[ "$(wasm-bindgen --version 2>/dev/null)" == "wasm-bindgen 0.2.129" ]]; then
            exit 0
          fi
          cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Install pnpm
        run: npm install --global pnpm@11.26.0
      - name: Install the web workspace
        working-directory: web
        run: pnpm install --frozen-lockfile
      # The TypeScript sources import the generated wasm glue, so the front end
      # is built before anything type-checks or bundles it.
      - name: Build the WebAssembly front end
        run: scripts/build-web.sh
      - name: Type-check the TypeScript
        working-directory: web
        run: pnpm typecheck
      - name: Build the package and the demo site
        working-directory: web
        run: pnpm build
      - name: Install the browser the suite drives
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the acceptance suite
        working-directory: web
        run: pnpm test

  # A single required status check for branch protection. Package builds live in
  # `packages.yml`, which is path-filtered: a skipped workflow reports no status
  # at all, so requiring it would block every pull request that changes no
  # packaging input.
  ci:
    if: always()
    needs: [check, fuzz, packaging, winget, web]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
