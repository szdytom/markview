name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    uses: ./.github/workflows/checks.yml

  pbt:
    uses: ./.github/workflows/pbt.yml

  golden:
    uses: ./.github/workflows/golden.yml

  fuzz:
    uses: ./.github/workflows/fuzz.yml

  android:
    uses: ./.github/workflows/android.yml

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-dist
      - name: Install packaging tools
        run: |
          bash scripts/ci_install_packages.sh shellcheck
      - name: Lint the workflows we own
        # `release.yml` is generated by cargo-dist and cannot be hand-edited, so
        # its shellcheck findings are not actionable here. shellcheck is already
        # installed, so actionlint also checks the scripts inside `run:` blocks.
        run: |
          bash <(curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
          ./actionlint -color .github/workflows/ci.yml \
            .github/workflows/packages.yml .github/workflows/packaging.yml \
            .github/workflows/release-notes.yml \
            .github/workflows/extension-packages.yml .github/workflows/extension-release.yml \
            .github/workflows/winget.yml .github/workflows/winget-check.yml \
            .github/workflows/checks.yml .github/workflows/fuzz.yml \
            .github/workflows/pbt.yml .github/workflows/golden.yml \
            .github/workflows/android.yml .github/workflows/android-release.yml
      - name: Generated release files match the configuration
        # `cargo install cargo-dist` installs the bare `dist` binary, which
        # cargo will not resolve as a subcommand.
        run: |
          dist generate --check
          dist plan
      - name: Documentation links and audience indexes
        run: python3 scripts/test_documentation.py
      - name: Rendering configuration coverage
        run: python3 scripts/check_render_coverage.py
      - name: Changelog conventions
        run: |
          python3 scripts/check_changelog.py
          python3 -m unittest discover -s scripts -p 'test_check_changelog.py'
      - name: Release notes use the installable packages
        run: |
          python3 -m unittest discover -s scripts -p 'test_render_release_notes.py'
          python3 -m unittest discover -s scripts -p 'test_extension_release.py'
      - name: Android build orchestration
        run: python3 -m unittest discover -s android -p 'test_build.py'
      - name: CI infrastructure recovery
        run: python3 -m unittest discover -s scripts -p 'test_ci_infrastructure.py'
      - name: Committed icons match the source SVG
        run: cargo run -p xtask -- icons --check
      - name: Shell scripts are sound
        run: shellcheck scripts/package_*.sh scripts/verify_*.sh scripts/ci_*.sh scripts/test_render_goldens.sh android/ci-test.sh

  web-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Test cross-platform build orchestration
        run: python scripts/test_build_web.py

  winget:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - name: Check executable architecture and subsystem
        shell: pwsh
        run: ./scripts/test_windows_image.ps1
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Check MSI inspection and manifest generation
        shell: pwsh
        run: |
          python -m pip install PyYAML==6.0.3
          python -m unittest discover -s scripts -p 'test_generate_winget_manifest.py'
          if ($LASTEXITCODE -ne 0) { throw 'WinGet manifest tests failed' }
          ./scripts/test_generate_winget_manifest.ps1
          ./scripts/test_verify_winget_package.ps1
      - name: Check first-submission and API failure handling
        shell: pwsh
        run: ./scripts/test_winget_registration.ps1
      - name: Install WinGet
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          Install-Module Microsoft.WinGet.Client -Repository PSGallery -Force -Scope CurrentUser
          Repair-WinGetPackageManager -AllUsers
          winget --version
      - name: Validate and install the WinGet package
        shell: pwsh
        run: ./scripts/verify_winget_package.ps1

  scoop:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, windows-11-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Test Scoop verification and failure cleanup
        shell: pwsh
        run: ./scripts/test_verify_scoop_package.ps1
      - name: Validate the manifest against the Scoop schema
        shell: pwsh
        run: |
          Invoke-WebRequest https://raw.githubusercontent.com/ScoopInstaller/Scoop/master/schema.json -OutFile "$env:RUNNER_TEMP/scoop-schema.json"
          if (!(Get-Content packaging/scoop/markview.json -Raw | Test-Json -SchemaFile "$env:RUNNER_TEMP/scoop-schema.json")) {
            throw 'Invalid Scoop manifest'
          }
      - name: Install Scoop
        shell: pwsh
        run: |
          if (!(Get-Command scoop.ps1 -ErrorAction SilentlyContinue)) {
            Invoke-WebRequest https://get.scoop.sh -OutFile "$env:RUNNER_TEMP/install-scoop.ps1"
            & "$env:RUNNER_TEMP/install-scoop.ps1" -RunAsAdmin
            if ($LASTEXITCODE -ne 0) { throw 'Scoop setup failed' }
          }
          "$env:USERPROFILE/scoop/shims" >> $env:GITHUB_PATH
      - name: Verify Scoop installation and uninstallation
        shell: pwsh
        run: |
          $env:PATH += ";$env:ProgramFiles/7-Zip"
          $architecture = if ($env:PROCESSOR_ARCHITECTURE -eq 'ARM64') { 'arm64' } else { '64bit' }
          ./scripts/verify_scoop_package.ps1 -Architecture $architecture

  # The browser front end shares the engine but not its build: a `wasm32`
  # compile, the pinned `wasm-bindgen` CLI, the pnpm monorepo under `web/` and
  # the Playwright suite that drives the built demo. Nothing here is filtered by
  # path, because the engine, the stylesheets and the committed subset faces all
  # feed it, and a skipped job would leave the required `ci` check green.
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-directories: .tools
      - name: Install pnpm
        run: npm install --global pnpm@11.26.0
      - name: Install the web workspace
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Prepare WASM tools
        working-directory: web
        run: pnpm run setup
      - name: Build WASM, packages and the demo site
        working-directory: web
        run: pnpm build
      - name: Typecheck the documentation examples
        run: python3 scripts/test_web_documentation.py
      - name: Lint the web workspace
        working-directory: web
        run: pnpm lint
      - name: Install the browser the suite drives
        working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - name: Run the acceptance suite
        working-directory: web
        run: pnpm test
      - name: Test the package tarballs in a downstream consumer
        working-directory: web
        run: pnpm test:packages

  # A single required status check for branch protection. Package builds live in
  # `packages.yml`, which is path-filtered: a skipped workflow reports no status
  # at all, so requiring it would block every pull request that changes no
  # packaging input.
  ci:
    if: always()
    needs: [check, pbt, golden, fuzz, packaging, winget, scoop, web-tools, web, android]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
