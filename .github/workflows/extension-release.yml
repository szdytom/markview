name: Release Markview Integration
on:
  push:
    tags: ['markview-integration-v*']
permissions:
  contents: read
jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Validate tag and Marketplace identity
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # shellcheck disable=SC2016
          node --input-type=module -e '
            import fs from "node:fs";
            const p = JSON.parse(fs.readFileSync("web/app/vsc-ext/vscode/package.json"));
            if (process.env.RELEASE_TAG !== `markview-integration-v${p.version}` ||
                p.name !== "markview-export" || p.publisher !== "Stevvven") process.exit(1);
          '
  packages:
    needs: version
    uses: ./.github/workflows/extension-packages.yml
  publish:
    needs: packages
    if: github.repository == 'Stevvven777/markview'
    runs-on: ubuntu-latest
    environment: marketplace
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - uses: actions/download-artifact@v8
        with:
          pattern: markview-integration-*
          path: vsix
          merge-multiple: true
      - run: npm ci --prefix web/app/vsc-ext
      - name: Verify all six immutable packages
        run: python3 scripts/verify_extension_packages.py vsix
      - name: Require Marketplace credential
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: test -n "$VSCE_PAT"
      - name: Create GitHub release with the tested packages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          sha256sum vsix/*.vsix > vsix/SHA256SUMS
          gh release create "$RELEASE_TAG" vsix/*.vsix vsix/SHA256SUMS \
            --verify-tag --title "Markview Integration ${RELEASE_TAG#markview-integration-v}" \
            --notes-file web/app/vsc-ext/vscode/CHANGELOG.md
      - name: Publish the exact GitHub packages to Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: web/app/vsc-ext/node_modules/.bin/vsce publish --packagePath vsix/*.vsix --skip-duplicate
