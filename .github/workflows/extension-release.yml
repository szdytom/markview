name: Publish Markview Integration
on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable reader release tag (for example v0.4.5)
        required: true
        type: string
permissions:
  contents: read
jobs:
  publish:
    if: github.repository == 'szdytom/markview' && (inputs.plan == '' || !fromJson(inputs.plan).announcement_is_prerelease)
    runs-on: ubuntu-22.04
    environment: marketplace
    permissions:
      contents: read
      id-token: write
    concurrency:
      group: marketplace-markview-export
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RELEASE_PLAN: ${{ inputs.plan }}
      RELEASE_TAG: ${{ inputs.tag }}
    steps:
      - name: Resolve the published stable release
        id: release
        run: |
          tag="$RELEASE_TAG"
          if [ -n "$RELEASE_PLAN" ]; then
            tag=$(printf '%s' "$RELEASE_PLAN" | jq -er '.announcement_tag')
          fi
          gh api "repos/$GITHUB_REPOSITORY/releases/tags/$tag" > "$RUNNER_TEMP/release.json"
          jq -e --arg tag "$tag" '.draft == false and .prerelease == false and
            .tag_name == $tag and (.tag_name | test("^v[0-9]+\\.[0-9]+\\.[0-9]+$"))' \
            "$RUNNER_TEMP/release.json"
          printf 'tag=%s\n' "$tag" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.release.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Download the exact GitHub release packages
        env:
          TAG: ${{ steps.release.outputs.tag }}
        run: gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern '*.vsix' --pattern SHA256SUMS-vscode --dir vsix
      - name: Verify the released packages before authenticating
        run: |
          (cd vsix && sha256sum --check SHA256SUMS-vscode)
          python3 scripts/verify_extension_packages.py vsix
      - run: npm ci --prefix web/app/vsc-ext
      - name: Publish the released packages with Trusted Publishing
        run: web/app/vsc-ext/node_modules/.bin/vsce publish --oidc --packagePath vsix/*.vsix --skip-duplicate
