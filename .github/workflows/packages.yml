name: Packages

# Builds every installable package on each platform and keeps them as workflow
# artifacts. This is the pre-release check: it never publishes anything, so a
# failure leaves no release behind.
#
# Packaging only depends on its own inputs, so this workflow is path-filtered: a
# `src/`-only change is verified by `CI`, not here, and a manual run bypasses the
# filter. A workflow that path filtering skipped reports no status at all, so
# these jobs must never become branch-protection required checks -- `ci` in
# `ci.yml` is the required one.
on:
  push:
    paths:
      - Cargo.toml
      - Cargo.lock
      - dist-workspace.toml
      - .github/**
      - scripts/package_*.sh
      - scripts/verify_*
      - packaging/**
      - wix/**
      - assets/**
      - xtask/**
  pull_request:
    paths:
      - Cargo.toml
      - Cargo.lock
      - dist-workspace.toml
      - .github/**
      - scripts/package_*.sh
      - scripts/verify_*
      - packaging/**
      - wix/**
      - assets/**
      - xtask/**
  # Rebuild the packages on demand, for example to re-check a `src/`-only change
  # that does not touch a packaging input.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages-linux:
    # 22.04 keeps the archive usable on glibc 2.35, matching dist-workspace.toml.
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libfontconfig1-dev libxkbcommon-dev \
            libwayland-dev
      - uses: ./.github/actions/install-dist
      - name: Build the local archive
        run: |
          dist build --artifacts=local --target x86_64-unknown-linux-gnu
      - name: Extract the archive
        run: |
          mkdir -p dist
          tar -xzf target/distrib/markview-x86_64-unknown-linux-gnu.tar.gz \
            -C dist --strip-components=1
          ./dist/markview --help | head -1
      - name: Generate third-party notices
        run: |
          cargo install cargo-about --version 0.9.2 --locked --features cli
          cargo-about generate packaging/about.hbs -o third-party-notices.html
      - name: Build the Debian package and the AppImage
        env:
          MARKVIEW_NOTICES: ${{ github.workspace }}/third-party-notices.html
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p out
          cp target/distrib/markview-x86_64-unknown-linux-gnu.tar.gz* out/
          scripts/package_deb.sh ./dist/markview "$version" amd64 out
          scripts/package_appimage.sh ./dist/markview "$version" out
          scripts/verify_linux_packages.sh out
          (cd out && sha256sum ./* >SHA256SUMS)
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: markview-linux-packages
          path: out/*
          if-no-files-found: error

  packages-windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-dist
      - name: Build the archive and the MSI
        shell: bash
        run: |
          dist build --artifacts=local --target x86_64-pc-windows-msvc
      - name: Verify the MSI and portable archive
        shell: pwsh
        run: ./scripts/verify_windows_packages.ps1 target/distrib
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: markview-windows-packages
          path: |
            target/distrib/*.msi
            target/distrib/*.zip
            target/distrib/*.sha256
          if-no-files-found: error

  packages-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: ./.github/actions/install-dist
      - name: Build the archive
        run: |
          dist build --artifacts=local --target aarch64-apple-darwin
      - name: Extract the archive
        run: |
          mkdir -p dist
          tar -xzf target/distrib/markview-aarch64-apple-darwin.tar.gz -C dist --strip-components=1
          ./dist/markview --help | head -1
      - name: Build the application bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          mkdir -p out
          cp target/distrib/markview-aarch64-apple-darwin.tar.gz* out/
          scripts/package_macos_app.sh ./dist "$version" out
          scripts/verify_macos_package.sh out
          (cd out && shasum -a 256 ./* >SHA256SUMS)
      - name: Upload the packages
        uses: actions/upload-artifact@v7
        with:
          name: markview-macos-packages
          path: out/*
          if-no-files-found: error

  # One status for the whole workflow. Not a required check: see the header.
  packages:
    if: always()
    needs: [packages-linux, packages-windows, packages-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Fail unless every package job succeeded
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: exit 1
