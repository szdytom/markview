name: Android

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - uses: ./.github/actions/setup-android
      - name: Build the emulator APK
        run: python3 android/build.py --abi x86_64
      # The instrumentation APK compiles against the Activity classes and uses
      # the same development key. Keep this outside cargo-dist's `artifacts-*`.
      - uses: actions/upload-artifact@v7
        with:
          name: markview-android-debug
          path: |
            target/android/markview-android-debug.apk
            target/android/classes/
            target/android/debug.keystore
          if-no-files-found: error

  test:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - layout: phone
            profile: pixel_6
            boundary-width: 1198
          - layout: tablet
            profile: pixel_tablet
            boundary-width: 1200
    env:
      DISPLAY: ':99'
      LIBGL_ALWAYS_SOFTWARE: 'true'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: dtolnay/rust-toolchain@stable
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - uses: actions/download-artifact@v8
        with:
          name: markview-android-debug
          path: target/android
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Mesa supplies Vulkan on the hosted runner; this renderer fails shader
      # creation with the pinned emulator's bundled SwiftShader.
      - name: Set up Mesa and a headless display
        run: |
          sudo apt-get update
          sudo apt-get install -y mesa-vulkan-drivers libgl1-mesa-dri xvfb
          echo "VK_DRIVER_FILES=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)" >> "$GITHUB_ENV"
          Xvfb :99 -screen 0 1280x1024x24 -nolisten tcp > "$RUNNER_TEMP/xvfb.log" 2>&1 &
      - name: Test the reader, lifecycle and sw600dp boundary
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: default
          arch: x86_64
          profile: ${{ matrix.profile }}
          emulator-build: 13784423
          cores: 4
          ram-size: 4096M
          disable-linux-hw-accel: false
          emulator-options: -no-window -gpu host -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash android/ci-test.sh ${{ matrix.layout }} ${{ matrix.boundary-width }}
      - name: Upload reports, screenshots and device logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: markview-android-tests-${{ matrix.layout }}
          path: artifacts/android/
          if-no-files-found: warn
