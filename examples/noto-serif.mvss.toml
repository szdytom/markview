format_version = 2
version = 1
targets = ["ui", "pdf"]

[meta]
name = "Noto Serif Download"
description = "An example of declaring downloadable families; the builtin stylesheet already declares these"

# Every family below is already declared by the bundled `builtin` stylesheet, so
# installing this file changes nothing: it is kept as a worked example of the
# syntax. Open the Fonts page (Ctrl+, then Fonts) or run
# `markview fonts download` to fetch them without any stylesheet of your own.
#
# A family is not a font definition. `fontdef` says what a short name like
# `serif` means; `[[font-family]]` says how one concrete family is obtained.
# The names a rule can reach are the ones the downloaded files declare, so a
# family id is only a bookkeeping name for the reader and the command line.

[[font-family]]
id = "noto-serif"
lookfor = ["Noto Serif"]
description = "Latin reading serif, regular and bold and italic"
license = "OFL-1.1"
license_url = "https://scripts.sil.org/OFL"
homepage = "https://github.com/notofonts/noto-fonts"

# Sources are mirrors of one another: tried in order, the first that succeeds
# whole is the one used. They may be laid out differently, as these two are.
[[font-family.source]]
name = "GitHub release"
[[font-family.source.archives]]
url = "https://github.com/notofonts/latin-greek-cyrillic/releases/download/NotoSerif-v2.015/NotoSerif-v2.015.zip"
members = [
    "NotoSerif/hinted/ttf/NotoSerif-Regular.ttf",
    "NotoSerif/hinted/ttf/NotoSerif-Bold.ttf",
    "NotoSerif/hinted/ttf/NotoSerif-Italic.ttf",
]

[[font-family.source]]
name = "jsDelivr"
files = [
    "https://cdn.jsdelivr.net/gh/notofonts/noto-fonts@main/hinted/ttf/NotoSerif/NotoSerif-Regular.ttf",
    "https://cdn.jsdelivr.net/gh/notofonts/noto-fonts@main/hinted/ttf/NotoSerif/NotoSerif-Bold.ttf",
    "https://cdn.jsdelivr.net/gh/notofonts/noto-fonts@main/hinted/ttf/NotoSerif/NotoSerif-Italic.ttf",
]

# The subset faces are named "Noto Serif SC"; the full collections are named
# "Noto Serif CJK SC". Both are listed so either installed family is
# recognized. Each of these files is about 8 to 12 MiB.
[[font-family]]
id = "noto-serif-cjk-sc"
lookfor = ["Noto Serif SC", "Noto Serif CJK SC", "Source Han Serif SC"]
description = "Simplified Chinese reading serif, subset OTF"
license = "OFL-1.1"
license_url = "https://scripts.sil.org/OFL"
homepage = "https://github.com/notofonts/noto-cjk"

[[font-family.source]]
name = "GitHub release"
[[font-family.source.archives]]
url = "https://github.com/notofonts/noto-cjk/releases/download/Serif2.003/14_NotoSerifSC.zip"
members = [
    "SubsetOTF/SC/NotoSerifSC-Regular.otf",
    "SubsetOTF/SC/NotoSerifSC-Bold.otf",
]

[[font-family.source]]
name = "jsDelivr"
files = [
    "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Serif/SubsetOTF/SC/NotoSerifSC-Regular.otf",
    "https://cdn.jsdelivr.net/gh/notofonts/noto-cjk@main/Serif/SubsetOTF/SC/NotoSerifSC-Bold.otf",
]
