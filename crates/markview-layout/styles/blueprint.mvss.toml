format_version = 3
targets = ["ui"]
version = 6

[meta]
name = "Blueprint"
description = "Technical notes in chalk blue with measured sans-serif type"

# Diagrams are drawn in this theme's own palette: the preset supplies the
# structure, the colors below put it on the same paper and surfaces as the
# document around it.
[mermaid]
theme = "dark"
background = "#172B46"
text_color = "#E0EAF6"
primary_color = "#203C5C"
primary_text_color = "#E0EAF6"
primary_border_color = "#426080"
line_color = "#A1B9D4"
secondary_color = "#2D4D70"
tertiary_color = "#12243C"
edge_label_background = "#172B46"
cluster_background = "#12243C"
cluster_border = "#426080"
sequence_actor_fill = "#203C5C"
sequence_actor_border = "#426080"
sequence_actor_line = "#A1B9D4"
sequence_note_fill = "#2D4D70"
sequence_note_border = "#426080"
sequence_activation_fill = "#2D4D70"
sequence_activation_border = "#A1B9D4"
git_commit_label_color = "#172B46"
git_commit_label_background = "#A1B9D4"
git_tag_label_color = "#E0EAF6"
git_tag_label_background = "#203C5C"
git_tag_label_border = "#426080"
pie_colors = [
	"#72B7CA", "#728BCA", "#8572CA", "#B172CA", "#CA72B7", "#CA728B",
	"#CA8572", "#CAB172", "#B7CA72", "#8BCA72", "#72CA85", "#72CAB1",
]
pie_title_text_color = "#E0EAF6"
pie_section_text_color = "#172B46"
pie_legend_text_color = "#A1B9D4"
pie_stroke_color = "#172B46"
pie_outer_stroke_color = "#426080"

[[rule]]
when = ["body"]
line_height = 1.6
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", min_weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
color = "#E0EAF6"
background = "#172B46"

[[rule]]
when = ["link"]
color = "#85D8EC"

[[rule]]
when = ["link", "hover"]
color = "#C1F1FC"

[[rule]]
when = ["code"]
background = "#203C5C"

[[rule]]
when = ["code_block"]
background = "#203C5C"
theme = "base16-ocean.dark"

[[rule]]
when = ["code_block", "label"]
color = "#A1B9D4"

[[rule]]
when = ["blockquote"]
background = "#203C5C"
padding = [0.55, 0.8, 0.55, 1.0]
border_width = 2.0
border_color = "#85D8EC"

[[rule]]
when = ["marker"]
shape = ["square", "minus"]
color = "#A1B9D4"

[[rule]]
when = ["task_marker"]
color = "#172B46"
background = "#172B46"
accent = "#85D8EC"
border_color = "#85D8EC"

[[rule]]
when = ["table", "cell"]
border_color = "#426080"

[[rule]]
when = ["table", "header"]
background = "#203C5C"

[[rule]]
when = ["hr"]
color = "#426080"

[[rule]]
when = ["selection"]
background = "#85D8EC47"

[[rule]]
when = ["img"]
border_color = "#426080"

[[rule]]
when = ["img", "caption"]
color = "#A1B9D4"

[[rule]]
when = ["img", "placeholder"]
color = "#A1B9D4"
background = "#203C5C"

[[rule]]
when = ["scrollbar"]
track = "#426080"
thumb = "#A1B9D4"
thumb_hover = "#85D8EC"

[[rule]]
when = ["ui"]
color = "#E0EAF6"
background = "#12243C"
muted = "#A1B9D4"
accent = "#85D8EC"
border_color = "#426080"
warning = "#F3CE7A"
error = "#FFB2BB"
shadow = "#00000000"
scrim = "#10192370"

[[rule]]
when = ["ui", "panel"]
background = "#1D3452"

[[rule]]
when = ["ui", "toolbar"]
background = "#12243C"

[[rule]]
when = ["ui", "statusbar"]
background = "#12243C"

[[rule]]
when = ["ui", "button"]
background = "#1D3452"
hover_background = "#2D4D70"
active_background = "#355F83"
disabled_color = "#A1B9D4"
focus_color = "#85D8EC"

[[rule]]
when = ["h1"]
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", min_weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.85
color = "#E0EAF6"
space_before = 0.2
space_after = 0.65

[[rule]]
when = ["h2"]
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", min_weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.55
color = "#85D8EC"
space_before = 0.85
space_after = 0.65

[[rule]]
when = ["h3"]
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", min_weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.22
color = "#E0EAF6"
space_before = 0.85
space_after = 0.65

[[rule]]
when = ["em"]
font = [{ family = "sans-serif", variant = "italic" }, { family = "regularscript[cjk]" }, { family = "regularscript[cjk]", weight = 500 }, { family = "regularscript[cjk]", weight = 400 }, { family = "sans-serif[cjk]", variant = "italic", synthetic_italic = true, min_weight = 500 }, { family = "sans-serif[cjk]", variant = "italic", synthetic_italic = true }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["blockquote"]
media = ["phone"]
padding = [0.2, 0.2, 0.2, 0.6]

[[rule]]
when = ["table", "cell"]
media = ["phone"]
padding = 0.35

[[rule]]
when = ["list"]
media = ["phone"]
indent = 0.15
marker_width = 1.0
space_after = 0.6

[[rule]]
when = ["enum"]
media = ["phone"]
indent = 0.15
marker_width = 1.0
space_after = 0.6

# Lighter type accents keep callout headers readable on dark paper.
[[rule]]
when = ["callout_note", "label"]
color = "#91BCE3"

[[rule]]
when = ["callout_tip", "label"]
color = "#7FC6C9"

[[rule]]
when = ["callout_success", "label"]
color = "#90C5A0"

[[rule]]
when = ["callout_warning", "label"]
color = "#E0BB79"

[[rule]]
when = ["callout_danger", "label"]
color = "#E39AA1"

[[rule]]
when = ["callout_example", "label"]
color = "#BDA6E3"

[[rule]]
when = ["callout_quote", "label"]
color = "#ACB8C7"
