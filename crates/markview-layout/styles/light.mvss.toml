format_version = 3
targets = ["ui"]
version = 8

[meta]
name = "Light"
description = "Clear daylight, graphite text and mineral blue"

[[rule]]
when = ["body"]
color = "#283343"
background = "#F9FAFC"

[[rule]]
when = ["link"]
color = "#275D91"

[[rule]]
when = ["link", "hover"]
color = "#17436C"

[[rule]]
when = ["code"]
background = "#EDF1F6"

[[rule]]
when = ["code_block"]
background = "#EDF1F6"
theme = "InspiredGitHub"

[[rule]]
when = ["code_block", "label"]
color = "#5D6C80"

[[rule]]
when = ["blockquote"]
border_color = "#275D91"

[[rule]]
when = ["details"]
background = "#EDF1F6"
border_color = "#D5DDE7"
padding = [0.35, 0.6, 0.45, 0.6]
radius = 4.0

[[rule]]
when = ["summary"]
color = "#283343"

[[rule]]
when = ["summary", "hover"]
color = "#17436C"

[[rule]]
when = ["marker"]
color = "#5D6C80"

[[rule]]
when = ["task_marker"]
color = "#F9FAFC"
background = "#F9FAFC"
accent = "#275D91"
border_color = "#275D91"

[[rule]]
when = ["table", "cell"]
border_color = "#D5DDE7"

[[rule]]
when = ["table", "header"]
background = "#EDF1F6"

[[rule]]
when = ["hr"]
color = "#D5DDE7"

[[rule]]
when = ["selection"]
background = "#275D9147"

[[rule]]
when = ["img"]
border_color = "#D5DDE7"

[[rule]]
when = ["img", "caption"]
color = "#5D6C80"

[[rule]]
when = ["img", "placeholder"]
color = "#5D6C80"
background = "#EDF1F6"

[[rule]]
when = ["scrollbar"]
track = "#D5DDE7"
thumb = "#5D6C80"
thumb_hover = "#275D91"

[[rule]]
when = ["ui"]
color = "#263445"
background = "#EEF2F7"
muted = "#526175"
accent = "#275D91"
border_color = "#D5DDE7"
warning = "#8A5800"
error = "#AB303D"
shadow = "#00000000"
scrim = "#10192370"

[[rule]]
when = ["ui", "panel"]
background = "#FFFFFF"

[[rule]]
when = ["ui", "toolbar"]
background = "#E0E7F0"

[[rule]]
when = ["ui", "statusbar"]
background = "#EEF2F7"

[[rule]]
when = ["ui", "button"]
background = "#FFFFFF"
hover_background = "#D4DDE9"
active_background = "#D3E2F3"
disabled_color = "#5D6C80"
focus_color = "#275D91"

[[rule]]
when = ["search"]
background = "#E9BA4547"

[[rule]]
when = ["search_current"]
background = "#D8952477"

# Compact headings and containers for phone reading.
[[rule]]
when = ["h1"]
media = ["phone"]
size = 1.5
line_height = 1.3
space_after = 0.6

[[rule]]
when = ["h2"]
media = ["phone"]
size = 1.25
line_height = 1.3
space_after = 0.5

[[rule]]
when = ["h3"]
media = ["phone"]
size = 1.12
line_height = 1.3
space_after = 0.45

[[rule]]
when = ["h4"]
media = ["phone"]
size = 1.05
line_height = 1.3
space_after = 0.4

[[rule]]
when = ["h5"]
media = ["phone"]
line_height = 1.3
space_after = 0.4

[[rule]]
when = ["h6"]
media = ["phone"]
line_height = 1.3
space_after = 0.4

[[rule]]
when = ["blockquote"]
media = ["phone"]
padding = [0.2, 0.2, 0.2, 0.6]

[[rule]]
when = ["table", "cell"]
media = ["phone"]
padding = 0.35

[[rule]]
when = ["list"]
media = ["phone"]
indent = 0.15
marker_width = 1.0
space_after = 0.6

[[rule]]
when = ["enum"]
media = ["phone"]
indent = 0.15
marker_width = 1.0
space_after = 0.6
