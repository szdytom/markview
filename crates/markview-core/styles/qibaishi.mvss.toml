format_version = 2
version = 7
targets = ["pdf"]

[meta]
name = "Qi Baishi"
description = "Qi Baishi-inspired document layout"

[[fontdef]]
id = "serif"
lookfor = ["TeX Gyre Pagella", "Iowan Old Style", "Palatino Linotype", "Palatino", "Georgia", "serif"]

[[fontdef]]
id = "assignment-heading"
lookfor = ["TeX Gyre Pagella", "Iowan Old Style", "Palatino Linotype", "Palatino", "Georgia", "serif"]

[[fontdef]]
id = "monospace"
lookfor = ["Noto Sans Mono", "Menlo", "Consolas", "Liberation Mono", "Droid Sans Mono", "monospace"]

[[font-family]]
id = "tex-gyre-pagella"
lookfor = ["TeX Gyre Pagella"]
description = "Palatino-style serif, regular and bold with italics"
license = "LicenseRef-GUST-Font"
license_url = "https://tug.org/fonts/licenses/GUST-FONT-LICENSE.txt"
homepage = "https://ctan.org/pkg/tex-gyre"

[[font-family.source]]
name = "CTAN (international)"
files = [
    { url = "https://tug.ctan.org/fonts/tex-gyre/opentype/texgyrepagella-regular.otf", sha256 = "44e64260716d8f2bbe412baa1ee99b7c995190ac4573177c24def0b9200438c7" },
    { url = "https://tug.ctan.org/fonts/tex-gyre/opentype/texgyrepagella-italic.otf", sha256 = "069bb27f48eb98a741715227fc6e4b7baf3639c29fc13925f70d1ed8884ac29a" },
    { url = "https://tug.ctan.org/fonts/tex-gyre/opentype/texgyrepagella-bold.otf", sha256 = "dd4f9b69f0b24f1fb9be8634abf1fce2009e5c68a30842a3e9f5d6e535900abd" },
    { url = "https://tug.ctan.org/fonts/tex-gyre/opentype/texgyrepagella-bolditalic.otf", sha256 = "556fd64655a92bd9f5485ae2c03f7b9cdaf745a27a91d7edb3c3abde997206d2" },
]

[[font-family.source]]
name = "TUNA (China)"
files = [
    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/tex-gyre/opentype/texgyrepagella-regular.otf", sha256 = "44e64260716d8f2bbe412baa1ee99b7c995190ac4573177c24def0b9200438c7" },
    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/tex-gyre/opentype/texgyrepagella-italic.otf", sha256 = "069bb27f48eb98a741715227fc6e4b7baf3639c29fc13925f70d1ed8884ac29a" },
    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/tex-gyre/opentype/texgyrepagella-bold.otf", sha256 = "dd4f9b69f0b24f1fb9be8634abf1fce2009e5c68a30842a3e9f5d6e535900abd" },
    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/tex-gyre/opentype/texgyrepagella-bolditalic.otf", sha256 = "556fd64655a92bd9f5485ae2c03f7b9cdaf745a27a91d7edb3c3abde997206d2" },
]

[page]
size = "a4"
margin = [18, 20, 22, 20]
header_left = ""
header_center = ""
header_right = ""
footer_left = ""
footer_center = ""
footer_right = ""

[page.header]
rule_width = 1.5
rule_color = "#343C35"

[[rule]]
when = ["body"]
color = "#272B30"
background = "#FFFFFF"
font = [{ family = "serif" }, { family = "serif", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
line_height = 1.55

[[rule]]
when = ["p"]
space_before = 0.0
space_after = 0.7826
orphans = 3
widows = 3

[[rule]]
when = ["h1"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 2.1739
weight = 400
color = "#2C332E"
line_height = 1.28
space_before = 0.0
space_after = 1.5652
border_edges = [0, 0, 1, 0]
border_color = "#A23C35"
padding = [0, 0, 1.5652, 0]

[[rule]]
when = ["h2"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.3043
weight = 600
color = "#343C35"
line_height = 1.28
space_before = 1.1739
space_after = 0.9130
heading_marker = [0.5217, 1.0435, 0.7826]
marker_color = "#A23C35"

[[rule]]
when = ["h3"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.0435
weight = 600
color = "#272B30"
line_height = 1.28
space_before = 0.7826
space_after = 0.6522

[[rule]]
when = ["link"]
color = "#343C35"
decoration = ["underline"]

[[rule]]
when = ["blockquote"]
color = "#272B30"
background = "#FFFFFF"
border_edges = [0, 0, 0, 2]
border_color = "#A23C35"
padding = [0.7826, 1.1739, 0.7826, 1.1739]
space_before = 0.7826
space_after = 1.5652
corner_radii = [0, 0, 0, 0]
keep_together = true

[[rule]]
when = ["blockquote", "p"]
size = 0.8696
line_height = 1.55
space_before = 0.0
space_after = 0.2609

[[rule]]
when = ["blockquote", "p", "first_child", "strong"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.825
weight = 600
letter_spacing = 0.09

[[rule]]
when = ["table"]
size = 0.8696
line_height = 1.5
space_before = 0.3913
space_after = 1.1739

[[rule]]
when = ["table", "cell"]
padding = [0.5870, 0.7826, 0.5870, 0.7826]
border_edges = [0, 0, 1, 0]
border_color = "#D9D8D2"
background = "#FFFFFF"

[[rule]]
when = ["table", "header"]
color = "#343C35"
background = "#FFFFFF"
border_edges = [2, 0, 1, 0]
border_color = "#343C35"

[[rule]]
when = ["table", "cell", "last_child"]
border_edges = [0, 0, 2, 0]
border_color = "#343C35"

[[rule]]
when = ["table", "header", "last_child"]
border_edges = [2, 0, 2, 0]

[[rule]]
when = ["hr"]
color = "#DED9C9"
border_width = 1
space_before = 1.1739
space_after = 1.9565

[[rule]]
when = ["code"]
size = 0.88
background = "#00000000"
padding = 0

[[rule]]
when = ["code_block"]
wrap = true
size = 0.88
line_height = 1.5
padding = 1.0435
background = "#F2F1ED"
theme = "none"

[[rule]]
when = ["code_block", "label"]
show = false

[[rule]]
when = ["ui"]
color = "#272B30"
background = "#F7F5EF"
muted = "#555D55"
accent = "#343C35"
border_color = "#DED9C9"
error = "#A23C35"

[[rule]]
when = ["selection"]
background = "#343C3540"

[[rule]]
when = ["task_marker"]
accent = "#343C35"
border_color = "#343C35"

[[rule]]
when = ["link", "hover"]
color = "#A23C35"
