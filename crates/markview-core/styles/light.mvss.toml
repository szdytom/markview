format_version = 2
targets = ["ui"]
version = 2

[meta]
name = "Light"
description = "Clear daylight, graphite text and mineral blue"

[[rule]]
when = ["body"]
color = "#283343"
background = "#F9FAFC"

[[rule]]
when = ["link"]
color = "#275D91"

[[rule]]
when = ["link", "hover"]
color = "#17436C"

[[rule]]
when = ["code"]
background = "#EDF1F6"

[[rule]]
when = ["code_block"]
background = "#EDF1F6"
theme = "InspiredGitHub"

[[rule]]
when = ["code_block", "label"]
color = "#5D6C80"

[[rule]]
when = ["blockquote"]
border_color = "#275D91"

[[rule]]
when = ["marker"]
color = "#5D6C80"

[[rule]]
when = ["task_marker"]
color = "#F9FAFC"
background = "#F9FAFC"
accent = "#275D91"
border_color = "#275D91"

[[rule]]
when = ["table", "cell"]
border_color = "#D5DDE7"

[[rule]]
when = ["table", "header"]
background = "#EDF1F6"

[[rule]]
when = ["hr"]
color = "#D5DDE7"

[[rule]]
when = ["selection"]
background = "#275D9147"

[[rule]]
when = ["img"]
border_color = "#D5DDE7"

[[rule]]
when = ["img", "caption"]
color = "#5D6C80"

[[rule]]
when = ["img", "placeholder"]
color = "#5D6C80"
background = "#EDF1F6"

[[rule]]
when = ["scrollbar"]
track = "#D5DDE7"
thumb = "#5D6C80"
thumb_hover = "#275D91"

[[rule]]
when = ["ui"]
color = "#283343"
background = "#EEF2F7"
muted = "#5D6C80"
accent = "#275D91"
border_color = "#D5DDE7"
error = "#AB303D"
shadow = "#00000000"
scrim = "#10192370"

[[rule]]
when = ["ui", "panel"]
background = "#FFFFFF"

[[rule]]
when = ["ui", "toolbar"]
background = "#EEF2F7"

[[rule]]
when = ["ui", "statusbar"]
background = "#EEF2F7"

[[rule]]
when = ["ui", "button"]
background = "#FFFFFF"
hover_background = "#DFE8F2"
active_background = "#D3E2F3"
disabled_color = "#5D6C80"
focus_color = "#275D91"
