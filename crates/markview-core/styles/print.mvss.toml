format_version = 2
targets = ["pdf"]
version = 2

[meta]
name = "Print"
description = "Markview's paper stylesheet for --pdf export"

# Paper is physical: the sheet is white, the ink is black, and spacing is
# tighter than on a backlit screen. Page furniture lives in the margins, so it
# costs no reading width.
[page]
size = "a4"
margin = [22, 20, 22, 20]
header_left = ""
header_center = ""
header_right = ""
footer_left = ""
footer_center = "{page} / {pages}"
footer_right = ""

[[rule]]
when = ["page"]
background = "#FFFFFF"

[[rule]]
when = ["body"]
color = "#000000"
background = "#FFFFFF"
font = [{ family = "serif" }, { family = "serif[cjk]", weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
line_height = 1.5

[[rule]]
when = ["p"]
space_after = 0.55

[[rule]]
when = ["h1"]
size = 1.8
weight = 700
space_before = 0.1
space_after = 0.5
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h2"]
size = 1.45
weight = 700
space_before = 0.55
space_after = 0.45
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h3"]
size = 1.2
weight = 700
space_before = 0.55
space_after = 0.4
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h4"]
size = 1.1
weight = 700
space_before = 0.55
space_after = 0.35
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h5"]
size = 1.0
weight = 700
space_before = 0.55
space_after = 0.35
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h6"]
size = 0.95
weight = 700
space_before = 0.55
space_after = 0.35
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["em"]
font = [
	{ family = "serif", variant = "italic" },
	# CJK families usually ship no italic, so their Han text is sheared.
	{ family = "serif[cjk]", variant = "italic", synthetic_italic = true, weight = 500 }, { family = "serif[cjk]", variant = "italic", synthetic_italic = true },
	{ family = "emoji", weight = 400 },
]

[[rule]]
when = ["strong"]
weight = 700

# A link is not clickable on paper, so it keeps the body ink instead of the
# reader's accent color.
[[rule]]
when = ["link"]
color = "#000000"

[[rule]]
when = ["del"]
decoration = ["line-through"]

[[rule]]
when = ["sup"]
size = 0.7

[[rule]]
when = ["code"]
font = [{ family = "monospace" }, { family = "monospace[cjk]", weight = 500 }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.9
padding = [0.15, 0.3, 0.15, 0.3]
background = "#F0F0F0"

[[rule]]
when = ["code_block"]
theme = "InspiredGitHub"
font = [{ family = "monospace" }, { family = "monospace[cjk]", weight = 500 }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.85
line_height = 1.45
background = "#F4F4F4"
padding = [0.5, 0.6, 0.5, 0.6]
space_after = 0.55

[[rule]]
when = ["code_block", "label"]
color = "#5A5A5A"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.65

[[rule]]
when = ["blockquote"]
border_color = "#9AA0A6"
border_width = 2.5
padding = [0.18, 0.18, 0.18, 0.9]
space_after = 0.55

[[rule]]
when = ["details"]
background = "#F4F5F7"
border_color = "#C7CCD1"
padding = [0.3, 0.5, 0.4, 0.5]
radius = 4.0

[[rule]]
when = ["summary"]
color = "#000000"

[[rule]]
when = ["list"]
indent = 0.5
space_after = 0.55

[[rule]]
when = ["enum"]
indent = 0.5
space_after = 0.55

[[rule]]
when = ["marker"]
color = "#5A5A5A"
size = 0.9
align = "center"

[[rule]]
when = ["task_marker"]
color = "#FFFFFF"
background = "#FFFFFF"
accent = "#315D86"
border_color = "#315D86"
border_width = 1.2
radius = 2.5
align = "center"

[[rule]]
when = ["footnote"]
size = 0.88
space_after = 0.55

[[rule]]
when = ["table"]
size = 0.88
space_after = 0.55

[[rule]]
when = ["table", "cell"]
border_color = "#BFBFBF"
border_width = 0.8
padding = [0.36, 0.5, 0.36, 0.5]

[[rule]]
when = ["table", "header"]
weight = 700
background = "#F0F0F0"

[[rule]]
when = ["hr"]
color = "#BFBFBF"
border_width = 1.0
space_before = 0.4
space_after = 0.55

[[rule]]
when = ["img"]
align = "center"
padding = 0.0
border_width = 0.0
border_color = "#BFBFBF"
background = "#00000000"

[[rule]]
when = ["img", "caption"]
source = "title_or_alt"
align = "center"
size = 0.8
line_height = 1.3
space_before = 0.2
space_after = 0.0
color = "#5A5A5A"

[[rule]]
when = ["img", "placeholder"]
size = 0.78
color = "#5A5A5A"
background = "#F0F0F0"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

# Page furniture: grey enough to stay out of the reading, centered on the
# margin it sits in.
[[rule]]
when = ["page_header"]
color = "#5A5A5A"
size = 0.75
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["page_footer"]
color = "#5A5A5A"
size = 0.75
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["page_number"]
color = "#000000"
size = 0.75
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

# A document may still draw reader chrome colors (a formula error box, an
# unavailable image); the print sheet resolves them to grey on white.
[[rule]]
when = ["ui"]
color = "#000000"
background = "#FFFFFF"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
muted = "#5A5A5A"
accent = "#315D86"
border_color = "#BFBFBF"
error = "#A13F3F"
shadow = "#1019232E"
scrim = "#1019233D"
