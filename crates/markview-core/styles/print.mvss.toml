format_version = 2
version = 1

[[fontdef]]
id = "serif"
lookfor = ["Georgia", "Times New Roman", "Noto Serif", "DejaVu Serif", "Liberation Serif", "Linux Libertine", "serif"]

[[fontdef]]
id = "sans-serif"
lookfor = ["Helvetica", "Arial", "Noto Sans", "DejaVu Sans", "Liberation Sans", "Ubuntu", "sans-serif"]

[[fontdef]]
id = "serif[cjk]"
type = "SC"
lookfor = ["Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "SimSun", "NSimSun", "STSong", "AR PL UMing CN", "AR PL SungtiL GB", "serif"]

[[fontdef]]
id = "serif[cjk]"
type = "TC"
lookfor = ["Noto Serif CJK TC", "Source Han Serif TC", "Songti TC", "PMingLiU", "AR PL UMing TW", "serif"]

[[fontdef]]
id = "serif[cjk]"
type = "JP"
lookfor = ["Noto Serif CJK JP", "Source Han Serif JP", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "MS PMincho", "MS Mincho", "serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "SC"
lookfor = ["PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", "Source Han Sans CJK SC", "Source Han Sans", "Founder Lan Ting Hei", "WenQuanYi Micro Hei", "Hiragino Sans GB", "Heiti SC", "sans-serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "TC"
lookfor = ["Noto Sans CJK TC", "Source Han Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "WenQuanYi Micro Hei", "sans-serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "JP"
lookfor = ["Noto Sans CJK JP", "Source Han Sans CJK JP", "Hiragino Sans", "Yu Gothic", "Meiryo", "sans-serif"]

[[fontdef]]
id = "monospace"
lookfor = ["Fira Code", "Consolas", "Noto Sans Mono", "monospace"]

[[fontdef]]
id = "monospace[cjk]"
type = "SC"
lookfor = ["Noto Sans Mono CJK SC", "Source Han Mono", "Source Code Pro", "monospace"]

[[fontdef]]
id = "emoji"
lookfor = ["Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", "Twemoji Mozilla", "EmojiOne Color", "JoyPixels", "Twitter Color Emoji", "EmojiSymbols"]

[meta]
name = "Print"
description = "Markview's paper stylesheet for --pdf export"

# Paper is physical: the sheet is white, the ink is black, and spacing is
# tighter than on a backlit screen. Page furniture lives in the margins, so it
# costs no reading width.
[page]
size = "a4"
margin = [22, 20, 22, 20]
header_left = ""
header_center = ""
header_right = ""
footer_left = ""
footer_center = "{page} / {pages}"
footer_right = ""

[[rule]]
when = ["page"]
background = "#FFFFFF"

[[rule]]
when = ["body"]
color = "#000000"
background = "#FFFFFF"
font = [{ family = "serif" }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
line_height = 1.5

[[rule]]
when = ["p"]
space_after = 0.55

[[rule]]
when = ["h1"]
size = 1.8
weight = 700
space_before = 0.1
space_after = 0.5
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h2"]
size = 1.45
weight = 700
space_before = 0.55
space_after = 0.45
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h3"]
size = 1.2
weight = 700
space_before = 0.55
space_after = 0.4
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h4"]
size = 1.1
weight = 700
space_before = 0.55
space_after = 0.35
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h5"]
size = 1.0
weight = 700
space_before = 0.55
space_after = 0.35
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h6"]
size = 0.95
weight = 700
space_before = 0.55
space_after = 0.35
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["em"]
font = [
	{ family = "serif", variant = "italic" },
	{ family = "serif[cjk]", variant = "italic" },
	{ family = "emoji", weight = 400 },
]

[[rule]]
when = ["strong"]
weight = 700

# A link is not clickable on paper, so it keeps the body ink instead of the
# reader's accent color.
[[rule]]
when = ["link"]
color = "#000000"

[[rule]]
when = ["del"]
decoration = ["line-through"]

[[rule]]
when = ["sup"]
size = 0.7

[[rule]]
when = ["code"]
font = [{ family = "monospace" }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.9
background = "#F0F0F0"

[[rule]]
when = ["code_block"]
theme = "InspiredGitHub"
font = [{ family = "monospace" }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.85
line_height = 1.45
background = "#F4F4F4"
padding = [0.5, 0.6, 0.5, 0.6]
space_after = 0.55

[[rule]]
when = ["code_block", "label"]
color = "#5A5A5A"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.65

[[rule]]
when = ["blockquote"]
border_color = "#9AA0A6"
border_width = 2.5
padding = [0.18, 0.18, 0.18, 0.9]
space_after = 0.55

[[rule]]
when = ["list"]
indent = 0.5
space_after = 0.55

[[rule]]
when = ["enum"]
indent = 0.5
space_after = 0.55

[[rule]]
when = ["marker"]
color = "#5A5A5A"
size = 0.9

[[rule]]
when = ["task_marker"]
color = "#315D86"
background = "#FFFFFF"
border_color = "#5A5A5A"

[[rule]]
when = ["footnote"]
size = 0.88
space_after = 0.55

[[rule]]
when = ["table"]
size = 0.88
space_after = 0.55

[[rule]]
when = ["table", "cell"]
border_color = "#BFBFBF"
border_width = 0.8
padding = [0.36, 0.5, 0.36, 0.5]

[[rule]]
when = ["table", "header"]
weight = 700
background = "#F0F0F0"

[[rule]]
when = ["hr"]
color = "#BFBFBF"
border_width = 1.0
space_before = 0.4
space_after = 0.55

[[rule]]
when = ["img"]
align = "center"
padding = 0.0
border_width = 0.0
border_color = "#BFBFBF"
background = "#00000000"

[[rule]]
when = ["img", "caption"]
source = "title_or_alt"
align = "center"
size = 0.8
line_height = 1.3
space_before = 0.2
space_after = 0.0
color = "#5A5A5A"

[[rule]]
when = ["img", "placeholder"]
size = 0.78
color = "#5A5A5A"
background = "#F0F0F0"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

# Page furniture: grey enough to stay out of the reading, centered on the
# margin it sits in.
[[rule]]
when = ["page_header"]
color = "#5A5A5A"
size = 0.55
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["page_footer"]
color = "#5A5A5A"
size = 0.55
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["page_number"]
color = "#000000"
size = 0.55
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

# A document may still draw reader chrome colors (a formula error box, an
# unavailable image); the print sheet resolves them to grey on white.
[[rule]]
when = ["ui"]
color = "#000000"
background = "#FFFFFF"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
muted = "#5A5A5A"
accent = "#315D86"
border_color = "#BFBFBF"
error = "#A13F3F"
shadow = "#1019232E"
scrim = "#1019233D"
