format_version = 2
version = 7
targets = ["pdf"]

[meta]
name = "Mondrian"
description = "Mondrian-inspired document layout"

[[fontdef]]
id = "serif"
lookfor = ["XCharter", "Charter", "Bitstream Charter", "Georgia", "serif"]

[[fontdef]]
id = "assignment-heading"
lookfor = ["TeX Gyre Heros", "Helvetica Neue", "Arial", "sans-serif"]

[[fontdef]]
id = "monospace"
lookfor = ["Noto Sans Mono", "Menlo", "Consolas", "Liberation Mono", "Droid Sans Mono", "monospace"]

[[font-family]]
id = "xcharter"
lookfor = ["XCharter"]
description = "Charter-style serif, regular and bold with italics"
license = "Bitstream-Charter"
license_url = "https://tug.ctan.org/fonts/xcharter/README"
homepage = "https://ctan.org/pkg/xcharter"

