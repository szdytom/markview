    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/xcharter/opentype/XCharter-Italic.otf", sha256 = "46100192810480a54dd287e8b3966d5bccf4603ba008d9c8f6bdbe562c6a134b" },
