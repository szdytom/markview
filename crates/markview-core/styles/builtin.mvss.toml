sha256 = "47204905f7a4b063dd580168795c84abfe3238962ad6b4810e2e3b86126d53c7"
members = ["usr/share/fonts/TTF/FiraCode-*.ttf"]

[svg.generic_font_family]
serif = ["serif"]
sans-serif = ["sans-serif"]
monospace = ["monospace"]
cursive = ["serif"]
fantasy = ["serif"]

[meta]
name = "Builtin"
description = "Shared font, layout and color fallbacks; always last"

[[rule]]
when = ["body"]
color = "#262B30"
background = "#FAFAF8"
# Emoji fonts usually have only a regular face, even inside strong text.
font = [{ family = "serif" }, { family = "serif[cjk]", weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
line_height = 1.65

[[rule]]
when = ["p"]
space_after = 0.8

[[rule]]
when = ["h1"]
size = 1.9
weight = 700
space_before = 0.17
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h2"]
size = 1.5
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h3"]
size = 1.25
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h4"]
size = 1.1
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h5"]
size = 1.0
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["h6"]
size = 0.95
weight = 700
space_before = 0.6
space_after = 0.8
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["em"]
font = [
	{ family = "serif", variant = "italic" },
	# CJK families usually ship no italic, so their Han text is sheared.
	{ family = "serif[cjk]", variant = "italic", synthetic_italic = true, weight = 500 }, { family = "serif[cjk]", variant = "italic", synthetic_italic = true },
	{ family = "emoji", weight = 400 },
]

[[rule]]
when = ["strong"]
weight = 700

[[rule]]
when = ["link"]
color = "#315D86"

[[rule]]
when = ["link", "hover"]
color = "#1F4568"

[[rule]]
when = ["del"]
decoration = ["line-through"]

[[rule]]
when = ["sup"]
size = 0.7

[[rule]]
when = ["code"]
font = [{ family = "monospace" }, { family = "monospace[cjk]", weight = 500 }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.9
padding = [0.15, 0.3, 0.15, 0.3]
background = "#EFF1F3"

[[rule]]
when = ["code_block"]
theme = "InspiredGitHub"
font = [{ family = "monospace" }, { family = "monospace[cjk]", weight = 500 }, { family = "monospace[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.9
line_height = 1.6
background = "#EFF1F3"
padding = [0.67, 0.78, 0.67, 0.78]
space_after = 0.8

[[rule]]
when = ["code_block", "label"]
color = "#69747E"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.67

[[rule]]
when = ["blockquote"]
border_color = "#315D86"
border_width = 3.0
padding = [0.22, 0.22, 0.22, 1.1]
space_after = 0.8

# A `<details>` frame and its summary weight are theme-neutral, so they live in
# the shared fallback; each reader theme supplies its own surface colors.
[[rule]]
when = ["details"]
padding = [0.3, 0.5, 0.4, 0.5]
space_after = 0.8

[[rule]]
when = ["summary"]
weight = 600

[[rule]]
when = ["list"]
indent = 0.5
space_after = 0.8

[[rule]]
when = ["enum"]
indent = 0.5
space_after = 0.8

[[rule]]
when = ["marker"]
color = "#69747E"
size = 0.9
align = "center"

[[rule]]
when = ["task_marker"]
color = "#FAFAF8"
background = "#FAFAF8"
accent = "#315D86"
border_color = "#315D86"
border_width = 1.5
radius = 2.5
align = "center"

[[rule]]
when = ["footnote"]
size = 0.88
space_after = 0.8

[[rule]]
when = ["table"]
size = 0.9
space_after = 0.8

[[rule]]
when = ["table", "cell"]
border_color = "#D8DEE3"
border_width = 1.0
padding = [0.44, 0.67, 0.44, 0.67]

[[rule]]
when = ["table", "header"]
weight = 700
background = "#EFF1F3"

[[rule]]
when = ["hr"]
color = "#D8DEE3"
border_width = 1.0
space_before = 0.5
space_after = 0.8

[[rule]]
when = ["selection"]
background = "#315D8647"

[[rule]]
when = ["img"]
align = "center"
padding = 0.0
border_width = 0.0
border_color = "#D8DEE3"
background = "#00000000"

[[rule]]
when = ["img", "caption"]
source = "title_or_alt"
align = "center"
size = 0.8
line_height = 1.4
space_before = 0.25
space_after = 0.0
color = "#69747E"

[[rule]]
when = ["img", "placeholder"]
size = 0.78
color = "#69747E"
background = "#EFF1F3"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]

[[rule]]
when = ["scrollbar"]
track = "#D8DEE3"
thumb = "#69747E"
thumb_hover = "#315D86"
thickness = 6.0
thickness_hover = 8.0
overflow_thickness = 6.0
overflow_thickness_hover = 8.0
gutter = 8.0

[[rule]]
when = ["ui"]
color = "#20252D"
background = "#F4F5F7"
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
muted = "#626C79"
accent = "#2856D8"
border_color = "#D5DAE1"
error = "#AB303D"
shadow = "#00000000"
scrim = "#10192352"

[[rule]]
when = ["ui", "panel"]
background = "#FFFFFF"

[[rule]]
when = ["ui", "toolbar"]
background = "#F4F5F7"

[[rule]]
when = ["ui", "statusbar"]
background = "#F4F5F7"

[[rule]]
when = ["ui", "button"]
background = "#FFFFFF"
hover_background = "#E2E8F1"
active_background = "#DFE7FA"
disabled_color = "#626C79"
focus_color = "#2856D8"
