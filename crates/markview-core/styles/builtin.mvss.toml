format_version = 2
targets = ["ui", "pdf"]
version = 1

[[fontdef]]
id = "serif"
lookfor = ["Noto Serif", "Georgia", "Times New Roman", "DejaVu Serif", "Liberation Serif", "Linux Libertine", "serif"]

[[fontdef]]
id = "sans-serif"
lookfor = ["Noto Sans", "Helvetica", "Arial", "DejaVu Sans", "Liberation Sans", "Ubuntu", "sans-serif"]

[[fontdef]]
id = "serif[cjk]"
type = "SC"
lookfor = ["Noto Serif CJK SC", "Noto Serif SC", "Source Han Serif SC", "Songti SC", "SimSun", "NSimSun", "STSong", "AR PL UMing CN", "AR PL SungtiL GB", "serif"]

[[fontdef]]
id = "serif[cjk]"
type = "TC"
lookfor = ["Noto Serif CJK TC", "Source Han Serif TC", "Songti TC", "PMingLiU", "AR PL UMing TW", "serif"]

[[fontdef]]
id = "serif[cjk]"
type = "JP"
lookfor = ["Noto Serif CJK JP", "Source Han Serif JP", "Hiragino Mincho ProN", "Hiragino Mincho Pro", "Yu Mincho", "MS PMincho", "MS Mincho", "serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "SC"
lookfor = ["Noto Sans CJK SC", "Noto Sans SC", "PingFang SC", "Microsoft YaHei", "Source Han Sans CJK SC", "Source Han Sans", "Founder Lan Ting Hei", "WenQuanYi Micro Hei", "Hiragino Sans GB", "Heiti SC", "sans-serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "TC"
lookfor = ["Noto Sans CJK TC", "Source Han Sans CJK TC", "PingFang TC", "Microsoft JhengHei", "Heiti TC", "WenQuanYi Micro Hei", "sans-serif"]

[[fontdef]]
id = "sans-serif[cjk]"
type = "JP"
lookfor = ["Noto Sans CJK JP", "Source Han Sans CJK JP", "Hiragino Sans", "Yu Gothic", "Meiryo", "sans-serif"]

[[fontdef]]
id = "monospace"
lookfor = ["Fira Code", "Consolas", "Noto Sans Mono", "monospace"]

[[fontdef]]
id = "monospace[cjk]"
type = "SC"
lookfor = ["Noto Sans Mono CJK SC", "Source Han Mono", "Source Code Pro", "monospace"]

[[fontdef]]
id = "emoji"
emoji = true
lookfor = ["Noto Color Emoji", "Apple Color Emoji", "Segoe UI Emoji", "Twemoji Mozilla", "EmojiOne Color", "JoyPixels", "Twitter Color Emoji", "EmojiSymbols"]

# The recommended downloads. A family is not a font definition: these only say
# how to obtain a concrete family, and a name that is already installed means
# there is nothing to fetch. Nothing here is fetched until the reader asks.
#
# Every family asks for each static weight its mirrors publish, from Thin to
# Black, so a rule that names 300 or 600 finds a real face instead of the
# nearest one.

