# Fira Code is the first `monospace` candidate. The upstream release carries
# the variable face, which covers every weight in one file; Arch's
# `ttf-fira-code` package is the same fonts as a zstd tarball of statics.
[[font-family]]
id = "fira-code"
lookfor = ["Fira Code"]
description = "Monospaced font with programming ligatures"
license = "OFL-1.1"
license_url = "https://scripts.sil.org/OFL"
homepage = "https://github.com/tonsky/FiraCode"

[[font-family.source]]
name = "GitHub release"
[[font-family.source.archives]]
url = "https://github.com/tonsky/FiraCode/releases/download/6.2/Fira_Code_v6.2.zip"
sha256 = "0949915ba8eb24d89fd93d10a7ff623f42830d7c5ffc3ecbf960e4ecad3e3e79"
members = ["variable_ttf/FiraCode-VF.ttf"]

# `download/` always serves the current package, so this source never goes
# stale and cannot pin a digest; the TUNA name fixes one package version.
[[font-family.source]]
name = "Arch Linux"
[[font-family.source.archives]]
url = "https://archlinux.org/packages/extra/any/ttf-fira-code/download/"
members = ["usr/share/fonts/TTF/FiraCode-*.ttf"]

