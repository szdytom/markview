format_version = 2
version = 1
targets = ["pdf"]

[meta]
name = "Monochrome"
description = "Black ink, white paper and restrained rules; no syntax colors"

[page]
margin = [22, 22, 24, 22]
header_left = "{title}"
footer_center = ""
footer_right = "{page} / {pages}"

[[rule]]
when = ["body"]
color = "#171717"
line_height = 1.55

[[rule]]
when = ["h1"]
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.8
weight = 700
color = "#171717"
space_before = 0.15
space_after = 0.65

[[rule]]
when = ["h2"]
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.4
weight = 700
color = "#171717"
space_before = 0.85
space_after = 0.45

[[rule]]
when = ["h3"]
font = [{ family = "sans-serif" }, { family = "sans-serif[cjk]", weight = 500 }, { family = "sans-serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.12
weight = 700
color = "#171717"
space_before = 0.85
space_after = 0.45

[[rule]]
when = ["link"]
color = "#171717"
decoration = ["underline"]

[[rule]]
when = ["blockquote"]
color = "#171717"
border_color = "#171717"
border_width = 1.2
padding = [0.5, 0.8, 0.5, 1.0]
background = "#FFFFFF"

[[rule]]
when = ["marker"]
color = "#171717"
shape = ["disc", "minus"]

[[rule]]
when = ["task_marker"]
accent = "#171717"
border_color = "#171717"
color = "#FFFFFF"
background = "#FFFFFF"
radius = 0.0

[[rule]]
when = ["table", "cell"]
border_color = "#D0D0D0"
border_width = 0.6

[[rule]]
when = ["table", "header"]
color = "#171717"
background = "#FFFFFF"

[[rule]]
when = ["hr"]
color = "#D0D0D0"
border_width = 0.7

[[rule]]
when = ["code"]
background = "#F3F3F3"

[[rule]]
when = ["code_block"]
theme = "none"
background = "#FFFFFF"
border_color = "#D0D0D0"
border_width = 0.6

[[rule]]
when = ["code_block", "label"]
color = "#555555"

[[rule]]
when = ["img", "caption"]
color = "#555555"

[[rule]]
when = ["img", "placeholder"]
color = "#555555"
background = "#F3F3F3"

[[rule]]
when = ["page_header"]
color = "#555555"

[[rule]]
when = ["page_footer"]
color = "#555555"

[[rule]]
when = ["page_number"]
color = "#171717"

[[rule]]
when = ["ui"]
color = "#171717"
muted = "#555555"
accent = "#171717"
error = "#171717"
border_color = "#D0D0D0"
