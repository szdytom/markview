format_version = 2
targets = ["ui"]
version = 4

[meta]
name = "Dark"
description = "Soft slate, silver text and glacier blue"

# Diagrams are drawn in this theme's own palette: the preset supplies the
# structure, the colors below put it on the same paper and surfaces as the
# document around it.
[mermaid]
theme = "dark"
background = "#202630"
text_color = "#DCE3ED"
primary_color = "#2B3441"
primary_text_color = "#DCE3ED"
primary_border_color = "#465366"
line_color = "#A5B3C5"
secondary_color = "#354459"
tertiary_color = "#252E3A"
edge_label_background = "#202630"
cluster_background = "#252E3A"
cluster_border = "#465366"
sequence_actor_fill = "#2B3441"
sequence_actor_border = "#465366"
sequence_actor_line = "#A5B3C5"
sequence_note_fill = "#354459"
sequence_note_border = "#465366"
sequence_activation_fill = "#354459"
sequence_activation_border = "#A5B3C5"
git_commit_label_color = "#202630"
git_commit_label_background = "#A5B3C5"
git_tag_label_color = "#DCE3ED"
git_tag_label_background = "#2B3441"
git_tag_label_border = "#465366"
pie_colors = [
	"#729ECA", "#7272CA", "#9E72CA", "#CA72CA", "#CA729E", "#CA7272",
	"#CA9E72", "#CACA72", "#9ECA72", "#72CA72", "#72CA9E", "#72CACA",
]
pie_title_text_color = "#DCE3ED"
pie_section_text_color = "#202630"
pie_legend_text_color = "#A5B3C5"
pie_stroke_color = "#202630"
pie_outer_stroke_color = "#465366"

[[rule]]
when = ["body"]
color = "#DCE3ED"
background = "#202630"

[[rule]]
when = ["link"]
color = "#98C5ED"

[[rule]]
when = ["link", "hover"]
color = "#C4E2FA"

[[rule]]
when = ["code"]
background = "#2B3441"

[[rule]]
when = ["code_block"]
background = "#2B3441"
theme = "base16-ocean.dark"

[[rule]]
when = ["code_block", "label"]
color = "#A5B3C5"

[[rule]]
when = ["blockquote"]
border_color = "#98C5ED"

[[rule]]
when = ["details"]
background = "#2B3441"
border_color = "#3C4757"
padding = [0.35, 0.6, 0.45, 0.6]
radius = 4.0

[[rule]]
when = ["summary"]
color = "#DCE3ED"

[[rule]]
when = ["summary", "hover"]
color = "#C4E2FA"

[[rule]]
when = ["marker"]
color = "#A5B3C5"

[[rule]]
when = ["task_marker"]
color = "#202630"
background = "#202630"
accent = "#98C5ED"
border_color = "#98C5ED"

[[rule]]
when = ["table", "cell"]
border_color = "#465366"

[[rule]]
when = ["table", "header"]
background = "#2B3441"

[[rule]]
when = ["hr"]
color = "#465366"

[[rule]]
when = ["selection"]
background = "#98C5ED47"

[[rule]]
when = ["img"]
border_color = "#465366"

[[rule]]
when = ["img", "caption"]
color = "#A5B3C5"

[[rule]]
when = ["img", "placeholder"]
color = "#A5B3C5"
background = "#2B3441"

[[rule]]
when = ["scrollbar"]
track = "#465366"
thumb = "#A5B3C5"
thumb_hover = "#98C5ED"

[[rule]]
when = ["ui"]
color = "#DCE3ED"
background = "#1B212A"
muted = "#A5B3C5"
accent = "#98C5ED"
border_color = "#465366"
error = "#FFA3B0"
shadow = "#00000000"
scrim = "#10192370"

[[rule]]
when = ["ui", "panel"]
background = "#252E3A"

[[rule]]
when = ["ui", "toolbar"]
background = "#1B212A"

[[rule]]
when = ["ui", "statusbar"]
background = "#1B212A"

[[rule]]
when = ["ui", "button"]
background = "#252E3A"
hover_background = "#354459"
active_background = "#3E526D"
disabled_color = "#A5B3C5"
focus_color = "#98C5ED"

[[rule]]
when = ["search"]
background = "#EBC86B47"

[[rule]]
when = ["search_current"]
background = "#EBC86B88"
