format_version = 2
targets = ["ui"]
version = 2

[meta]
name = "Dark"
description = "Soft slate, silver text and glacier blue"

[[rule]]
when = ["body"]
color = "#DCE3ED"
background = "#202630"

[[rule]]
when = ["link"]
color = "#98C5ED"

[[rule]]
when = ["link", "hover"]
color = "#C4E2FA"

[[rule]]
when = ["code"]
background = "#2B3441"

[[rule]]
when = ["code_block"]
background = "#2B3441"
theme = "base16-ocean.dark"

[[rule]]
when = ["code_block", "label"]
color = "#A5B3C5"

[[rule]]
when = ["blockquote"]
border_color = "#98C5ED"

[[rule]]
when = ["marker"]
color = "#A5B3C5"

[[rule]]
when = ["task_marker"]
color = "#202630"
background = "#202630"
accent = "#98C5ED"
border_color = "#98C5ED"

[[rule]]
when = ["table", "cell"]
border_color = "#465366"

[[rule]]
when = ["table", "header"]
background = "#2B3441"

[[rule]]
when = ["hr"]
color = "#465366"

[[rule]]
when = ["selection"]
background = "#98C5ED47"

[[rule]]
when = ["img"]
border_color = "#465366"

[[rule]]
when = ["img", "caption"]
color = "#A5B3C5"

[[rule]]
when = ["img", "placeholder"]
color = "#A5B3C5"
background = "#2B3441"

[[rule]]
when = ["scrollbar"]
track = "#465366"
thumb = "#A5B3C5"
thumb_hover = "#98C5ED"

[[rule]]
when = ["ui"]
color = "#DCE3ED"
background = "#1B212A"
muted = "#A5B3C5"
accent = "#98C5ED"
border_color = "#465366"
error = "#FFA3B0"
shadow = "#00000000"
scrim = "#10192370"

[[rule]]
when = ["ui", "panel"]
background = "#252E3A"

[[rule]]
when = ["ui", "toolbar"]
background = "#1B212A"

[[rule]]
when = ["ui", "statusbar"]
background = "#1B212A"

[[rule]]
when = ["ui", "button"]
background = "#252E3A"
hover_background = "#354459"
active_background = "#3E526D"
disabled_color = "#A5B3C5"
focus_color = "#98C5ED"
