format_version = 2
version = 1

[meta]
name = "Dark"
description = "Markview's default dark stylesheet"

[[rule]]
when = ["body"]
color = "#DDE2E7"
background = "#20252B"

[[rule]]
when = ["link"]
color = "#8FB9DD"

[[rule]]
when = ["link", "hover"]
color = "#B7D8F2"

[[rule]]
when = ["code"]
background = "#2A3139"

[[rule]]
when = ["code_block"]
background = "#2A3139"
theme = "base16-ocean.dark"

[[rule]]
when = ["code_block", "label"]
color = "#98A5B1"

[[rule]]
when = ["blockquote"]
border_color = "#8FB9DD"

[[rule]]
when = ["marker"]
color = "#98A5B1"

[[rule]]
when = ["task_marker"]
color = "#20252B"
background = "#20252B"
accent = "#8FB9DD"
border_color = "#8FB9DD"
border_width = 1.5
radius = 2.5

[[rule]]
when = ["table", "cell"]
border_color = "#414C58"

[[rule]]
when = ["table", "header"]
background = "#2A3139"

[[rule]]
when = ["hr"]
color = "#414C58"

[[rule]]
when = ["selection"]
background = "#8FB9DD47"

[[rule]]
when = ["img"]
border_color = "#414C58"

[[rule]]
when = ["img", "caption"]
color = "#98A5B1"

[[rule]]
when = ["img", "placeholder"]
color = "#98A5B1"
background = "#2A3139"

[[rule]]
when = ["scrollbar"]
track = "#414C58"
thumb = "#98A5B1"
thumb_hover = "#8FB9DD"

[[rule]]
when = ["ui"]
color = "#E8EBF0"
background = "#191C22"
muted = "#A1AAB8"
accent = "#8BAAFF"
border_color = "#3B424E"
error = "#FF9CA8"
shadow = "#00000000"
scrim = "#10192352"

[[rule]]
when = ["ui", "panel"]
background = "#22262E"

[[rule]]
when = ["ui", "toolbar"]
background = "#191C22"

[[rule]]
when = ["ui", "statusbar"]
background = "#191C22"

[[rule]]
when = ["ui", "button"]
background = "#22262E"
hover_background = "#343E4D"
active_background = "#354668"
disabled_color = "#A1AAB8"
focus_color = "#8BAAFF"
