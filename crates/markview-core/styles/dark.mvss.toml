format_version = 2
version = 1

[meta]
name = "Dark"
description = "Markview's default dark stylesheet"

[[rule]]
when = ["body"]
color = "#DDE2E7"
background = "#20252B"

[[rule]]
when = ["link"]
color = "#8FB9DD"

[[rule]]
when = ["link", "hover"]
color = "#B7D8F2"

[[rule]]
when = ["code"]
background = "#2A3139"

[[rule]]
when = ["code_block"]
background = "#2A3139"
theme = "base16-ocean.dark"

[[rule]]
when = ["code_block", "label"]
color = "#98A5B1"

[[rule]]
when = ["blockquote"]
border_color = "#8FB9DD"

[[rule]]
when = ["marker"]
color = "#98A5B1"

[[rule]]
when = ["task_marker"]
color = "#20252B"
background = "#20252B"
accent = "#8FB9DD"
border_color = "#8FB9DD"
border_width = 1.5
radius = 2.5

[[rule]]
when = ["table", "cell"]
border_color = "#414C58"

[[rule]]
when = ["table", "header"]
background = "#2A3139"

[[rule]]
when = ["hr"]
color = "#414C58"

[[rule]]
when = ["selection"]
background = "#8FB9DD47"

[[rule]]
when = ["img"]
border_color = "#414C58"

[[rule]]
when = ["img", "caption"]
color = "#98A5B1"

[[rule]]
when = ["img", "placeholder"]
color = "#98A5B1"
background = "#2A3139"

[[rule]]
when = ["scrollbar"]
track = "#414C58"
thumb = "#98A5B1"
thumb_hover = "#8FB9DD"

[[rule]]
when = ["ui"]
color = "#DDE2E7"
background = "#20252B"
muted = "#98A5B1"
accent = "#8FB9DD"
border_color = "#414C58"
error = "#F39A9A"

[[rule]]
when = ["ui", "panel"]
background = "#252E38F0"

[[rule]]
when = ["ui", "button"]
background = "#2A3139"
hover_background = "#35414F"
active_background = "#414C58"
disabled_color = "#98A5B1"
focus_color = "#8FB9DD"
