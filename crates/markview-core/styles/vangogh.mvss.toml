format_version = 2
version = 6
targets = ["pdf"]

[meta]
name = "Van Gogh"
description = "Van Gogh-inspired document layout"

[[fontdef]]
id = "serif"
lookfor = ["Libre Baskerville", "Baskerville", "Palatino Linotype", "Palatino", "Georgia", "serif"]

[[fontdef]]
id = "assignment-heading"
lookfor = ["Libre Baskerville", "Baskerville", "Palatino Linotype", "Palatino", "Georgia", "serif"]

[[fontdef]]
id = "monospace"
lookfor = ["Noto Sans Mono", "Menlo", "Consolas", "Liberation Mono", "monospace"]

[[font-family]]
id = "libre-baskerville"
lookfor = ["Libre Baskerville"]
description = "Baskerville-style serif, regular, italic and bold"
license = "OFL-1.1"
license_url = "https://openfontlicense.org/"
homepage = "https://ctan.org/pkg/librebaskerville"

[[font-family.source]]
name = "CTAN (international)"
files = [
    { url = "https://tug.ctan.org/fonts/librebaskerville/truetype/LibreBaskerville-Regular.ttf", sha256 = "da4d29043de90af40a2f91d2e7da58526afed6e1327a6c21db728b6178b81c8d" },
    { url = "https://tug.ctan.org/fonts/librebaskerville/truetype/LibreBaskerville-Italic.ttf", sha256 = "b6482799f4959aa3e79a46678118c156669d391874d733f308580602299346eb" },
    { url = "https://tug.ctan.org/fonts/librebaskerville/truetype/LibreBaskerville-Bold.ttf", sha256 = "51eaa0f0f8d3248c52b25e4d6b63c410fd6ad745869c532301646c0ec1fdd1ab" },
]

[[font-family.source]]
name = "TUNA (China)"
files = [
    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/librebaskerville/truetype/LibreBaskerville-Regular.ttf", sha256 = "da4d29043de90af40a2f91d2e7da58526afed6e1327a6c21db728b6178b81c8d" },
    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/librebaskerville/truetype/LibreBaskerville-Italic.ttf", sha256 = "b6482799f4959aa3e79a46678118c156669d391874d733f308580602299346eb" },
    { url = "https://mirrors.tuna.tsinghua.edu.cn/CTAN/fonts/librebaskerville/truetype/LibreBaskerville-Bold.ttf", sha256 = "51eaa0f0f8d3248c52b25e4d6b63c410fd6ad745869c532301646c0ec1fdd1ab" },
]

[page]
size = "a4"
margin = [18, 20, 22, 20]
header_left = ""
header_center = ""
header_right = ""
footer_left = ""
footer_center = ""
footer_right = ""

[page.header]
rule_width = 3
rule_color = "#244C80"

[[rule]]
when = ["body"]
color = "#272B30"
background = "#FFFFFF"
font = [{ family = "serif" }, { family = "serif", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
line_height = 1.55

[[rule]]
when = ["p"]
space_before = 0.0
space_after = 0.7826
orphans = 3
widows = 3

[[rule]]
when = ["h1"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 2.1739
weight = 400
color = "#244C80"
line_height = 1.28
space_before = 0.0
space_after = 1.5652
border_edges = [0, 0, 3, 0]
border_color = "#C79D45"
padding = [0, 0, 1.3043, 0]

[[rule]]
when = ["h2"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.3043
weight = 600
color = "#244C80"
line_height = 1.28
space_before = 1.1739
space_after = 0.9130
border_edges = [0, 0, 0, 4]
border_color = "#C79D45"
padding = [0, 0, 0, 0.9130]

[[rule]]
when = ["h3"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 1.0435
weight = 600
color = "#272B30"
line_height = 1.28
space_before = 0.7826
space_after = 0.6522

[[rule]]
when = ["link"]
color = "#244C80"
decoration = ["underline"]

[[rule]]
when = ["blockquote"]
color = "#272B30"
background = "#F6F0DF"
border_edges = [0, 0, 0, 3]
border_color = "#AF7921"
padding = [0.7826, 1.1739, 0.7826, 1.1739]
space_before = 0.7826
space_after = 1.5652
corner_radii = [0, 12, 12, 0]
keep_together = true

[[rule]]
when = ["blockquote", "p"]
size = 0.8696
line_height = 1.55
space_before = 0.0
space_after = 0.2609

[[rule]]
when = ["blockquote", "p", "first_child", "strong"]
font = [{ family = "assignment-heading" }, { family = "assignment-heading", weight = 700 }, { family = "serif[cjk]", min_weight = 500 }, { family = "serif[cjk]" }, { family = "emoji", weight = 400 }]
size = 0.825
weight = 600
letter_spacing = 0.09

[[rule]]
when = ["table"]
size = 0.8696
line_height = 1.5
space_before = 0.3913
space_after = 1.1739

[[rule]]
when = ["table", "cell"]
padding = [0.5870, 0.7826, 0.5870, 0.7826]
border_edges = [0, 0, 1, 0]
border_color = "#D9D8D2"
background = "#FFFFFF"

[[rule]]
when = ["table", "header"]
color = "#244C80"
background = "#F4F2EC"
border_edges = [2, 0, 1, 0]
border_color = "#244C80"

[[rule]]
when = ["table", "cell", "last_child"]
border_edges = [0, 0, 2, 0]
border_color = "#244C80"

[[rule]]
when = ["table", "header", "last_child"]
border_edges = [2, 0, 2, 0]

[[rule]]
when = ["hr"]
color = "#EAD8A6"
border_width = 2
space_before = 1.1739
space_after = 1.9565

[[rule]]
when = ["code"]
size = 0.88
background = "#00000000"
padding = 0

[[rule]]
when = ["code_block"]
wrap = true
size = 0.88
line_height = 1.5
padding = 1.0435
background = "#F2F1ED"
theme = "none"

[[rule]]
when = ["code_block", "label"]
show = false

[[rule]]
when = ["ui"]
color = "#272B30"
background = "#F7F5EF"
muted = "#555D55"
accent = "#244C80"
border_color = "#EAD8A6"
error = "#A23C35"

[[rule]]
when = ["selection"]
background = "#244C8040"

[[rule]]
when = ["task_marker"]
accent = "#244C80"
border_color = "#244C80"

[[rule]]
when = ["link", "hover"]
color = "#AF7921"
