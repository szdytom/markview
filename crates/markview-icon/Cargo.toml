[package]
name = "markview-icon"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lib]
proc-macro = true

[dependencies]
# `default-features = false` drops text shaping and font discovery: icons are
# geometry only. The proc macro runs on the host, so resolver 3 keeps this
# separate from the runtime `resvg`/`usvg` features.
usvg = { version = "0.49", default-features = false }
syn = "3"
quote = "1"

[lints]
workspace = true

[dev-dependencies]
proptest.workspace = true
