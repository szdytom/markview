[package]
name = "markview-platform"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[features]
test-support = []

[dev-dependencies]
proptest.workspace = true

[dependencies]
url = "2"
anyhow.workspace = true
log.workspace = true
notify.workspace = true
open.workspace = true
sys-locale.workspace = true
winit.workspace = true
futures-util = "0.3"
tokio = { workspace = true, features = ["sync"] }
tempfile.workspace = true
image = { version = "0.25.9", default-features = false, features = ["png"] }

# `O_NONBLOCK` keeps a special-file open from waiting; only the Unix targets
# need it.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "android"))'.dependencies]
arboard.workspace = true
rfd.workspace = true

[target.'cfg(target_os = "android")'.dependencies]
winit = { workspace = true, features = ["android-native-activity"] }
jni = "0.22"
android_logger = "0.15"

[target.'cfg(target_os = "windows")'.dependencies]
ico = "0.6"
same-file = "1"
# Direct Manipulation pans a precision touchpad with the OS's own inertia;
# winit initializes the COM apartment the viewport assembles in. The event
# handler macro expands to `::windows_core::` paths, so that crate is named
# here too.
windows = { version = "0.62", features = [
	"Win32_Foundation",
	"Win32_Graphics_DirectManipulation",
	"Win32_System_Com",
	"Win32_UI_Input_Pointer",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }
windows-core = "0.62"
windows-sys = { version = "0.61", features = [
	"Win32_Foundation",
	"Win32_Graphics_Gdi",
	"Win32_System_Console",
	"Win32_System_Threading",
	"Win32_UI_HiDpi",
	"Win32_UI_Input_KeyboardAndMouse",
	"Win32_UI_Shell",
	"Win32_UI_WindowsAndMessaging",
] }


[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.13", default-features = false, features = ["async-io", "settings"] }


[target.'cfg(target_os = "macos")'.dependencies]
# A double-clicked document arrives as an Apple Event, which only the Objective-C
# runtime can answer; `winit` drives it for us but does not expose the hook.
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-foundation = { version = "0.3", default-features = false, features = [
	"NSAppleEventDescriptor",
	"NSAppleEventManager",
	"NSNotification",
	"NSString",
	"std",
	"NSUserDefaults",
	"NSURL",
	"objc2-core-services",
] }
objc2-core-services = { version = "0.3", default-features = false, features = [
	"AE",
	"AEDataModel",
	"AppleEvents",
] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSButton", "NSControl", "NSResponder", "NSView", "NSWindow"] }
